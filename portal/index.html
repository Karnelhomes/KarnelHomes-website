<style>
:root{--n:#172B4D;--sub:#626F86;--bd:#DCDFE4;--bg:#F7F8F9;--blue:#0C66E4;--blue-d:#0055CC;--blue-bg:#E9F2FF;--green:#1F845A;--red:#C9372C;--r:3px}
*{box-sizing:border-box;margin:0}
body{font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--n);background:#fff; -webkit-tap-highlight-color: transparent;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--bd);background:#fff;position:sticky;top:0;z-index:20}
.logo{width:28px;height:28px;border-radius:6px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
.bn{font-weight:700;font-size:15px}.sp{flex:1}.chip{font-size:12px;color:var(--sub)}

.sh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 8px;font-size:12px;font-weight:700;color:var(--sub)}
.sh button{background:none;border:0;font-size:18px;line-height:1;color:var(--sub);border-radius:var(--r);width:24px;height:24px}

.pi{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:7px 8px;border-radius:var(--r)}

.dc.td .dn{background:var(--blue);color:#fff}
.chp{display:block;width:100%;text-align:left;border:0;border-radius:3px;padding:0 5px;margin-bottom:2px;font-size:12px;line-height:18px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chp.tk{background:#fff;border:1px dashed currentColor}.chp.dn2{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--sub);padding-left:4px}
.agh{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 4px}.agh.red{color:var(--red)}
.ai{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:8px;border-radius:3px;cursor:pointer;border-left:3px solid transparent;align-items:start}
.ai:hover{background:var(--bg)}.ai.soon{border-left-color:#F5CD47;background:#FFFCF0}.ai.od{border-left-color:var(--red);background:#FFF5F4}
.at{font-size:12px;color:var(--sub);padding-top:1px}.ai .meta{font-size:12px}
.lz.bk{background:#CFE1FD;color:#0055CC}.lz.rm{background:#DFD8FD;color:#5E4DB2}
.ck{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:500}

/* Project Right Sidebar Layout */
.proj-wrap {display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start; margin-top:16px}
.proj-right {background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:16px}

/* Collapsible Contractors Pane */
details.cpane { background:var(--bg); border:1px solid var(--bd); border-radius:6px; margin-top:16px; margin-bottom:8px; overflow:hidden;}
details.cpane summary { padding:12px 16px; font-weight:600; font-size:14px; cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; user-select:none; background:#fff; }
details.cpane summary::-webkit-details-marker { display:none; }
details.cpane[open] summary { border-bottom:1px solid var(--bd); }
.c-table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
.c-table th, .c-table td { padding:10px 16px; border-bottom:1px solid var(--bd); text-align:left; vertical-align:middle; }
.c-table th { background:var(--bg); color:var(--sub); font-weight:600; font-size:12px; }

@media(max-width:1100px){.cal{grid-template-columns:1fr}}
@media(max-width:900px){.board{grid-template-columns:1fr}.tbl .hide{display:none} .proj-wrap{grid-template-columns:1fr}}

  .app{grid-template-columns:1fr;height:auto}

<script>
const KEY='karnel_v3', SB_URL='https://giovxsxgkdilawyxuiqb.supabase.co', SB_KEY='sb_publishable_k9sU8tyILCmQTxAI36ufWQ__JsPNSRY';

// !! PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE !!
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzwZrBXM9aAbA9TXuTwiyAB-69wHrvP7a6_X_2526auOZFc8nUKoDrEmPyj0N7wZeM/exec'; 

const DEFAULT_STD=[
  '1. CDC / CC Approved',
 '2. Send Stamped Plans (Archi, BASIX, Struct, Stormwater)',
 '3. Survey - Pegout',
 '4. Site Ready (Fencing, Sediment Control, Banners)',
 '5. Benching',
 '6. Piering',
 '7. Pier Inspections (Struct Eng, Certifier, FJA - BPA) - 2 working days notice',
 '8. Internal Plumbing (1-week advance notice)',
 '9. Steel reinforcement for Slab',
 '10. MHF Termites Pipe Work - 2 working days notice',
 '11. Steel Inspections (Certifier & Structural Eng)',
 '12. Slab',
 '13. External Plumbing (1-week advance notice)',
 '14. Electrician & Certifier - Stormwater inspection (Same day as Extrenal Plumbing) - 2 working days notice',
 '15. Termite Perimeter (Next day MHF)'
];
const COLS=[['todo','To do'],['prog','In progress'],['done','Done']];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let P={},cur=null,tab='board',q='',sb=null,chan,saveT,rtT,dragId=null,view='proj',cy=new Date().getFullYear(),cm=new Date().getMonth(),indData=[];
let customWorkflow=[];

try{ customWorkflow = JSON.parse(localStorage.getItem(KEY+'_workflow')) || DEFAULT_STD; }
catch(e){ customWorkflow = [...DEFAULT_STD]; }

function saveWorkflowTmpl(){ localStorage.setItem(KEY+'_workflow', JSON.stringify(customWorkflow)); }

function showErr(m){const e=$('#err');e.style.display='block';e.innerHTML='Something went wrong: '+esc(m)+' <button class="btn s" onclick="resetLocal()">Reset this device and reload</button>'}
function resetLocal(){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_cur');location.reload()}
addEventListener('error',e=>showErr(e.message));
const keyOf=n=>String(n||'').replace(/[^a-z]/gi,'').slice(0,3).toUpperCase()||'PRJ';
const tint=n=>['#0C66E4','#1F845A','#8270DB','#C25100','#CD519D','#2B7A9B'][[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];

// -------- GOOGLE SYNC WEBHOOK DISPATCHER --------
function syncToGoogle(action, item, p) {
  if(!WEBHOOK_URL || WEBHOOK_URL.includes('YOUR_GOOGLE')) return;
  const ev = {
    id: item.id,
    projectName: p.name,
    title: item.title || item.text,
    date: item.date || item.due,
    time: item.time || '',
    who: item.who || '',
    note: item.note || '',
    done: item.done || item.status === 'done'
  };
  if(action !== 'delete' && !ev.date) return; // Only sync tasks with dates to the calendar
  
  fetch(WEBHOOK_URL, { 
    method: 'POST', 
    body: JSON.stringify({ action: action, event: ev }), 
    mode: 'no-cors' 
  }).catch(e => console.error("Sync error:", e));
}
// -------------------------------------------------

function norm(p){
  const A=x=>Array.isArray(x)?x.filter(o=>o&&typeof o==='object'):[];
  p.tasks=A(p.tasks||p.checklist).map(c=>({id:c.id||uid(),text:c.text||'Untitled task',due:c.due||'',status:c.status==='COMPLETED'?'done':(c.status||'todo')}));
  p.events=A(p.events).filter(e=>/^\d{4}-\d\d-\d\d/.test(e.date||'')).map(e=>({id:e.id||uid(),title:e.title||e.text||'Booking',date:e.date.slice(0,10),time:e.time||'',kind:e.kind||'booking',who:e.who||'',note:e.note||'',done:e.done??/COMPLET|DONE/i.test(e.status||'')}));
  p.contractors=A(p.contractors).map(c=>({id:c.id||uid(), type:c.type||'', name:c.name||'', phone:c.phone||''}));
  p.name=p.name||'Untitled project';p.created=p.created||p.updated_at||new Date().toISOString();p.key=p.key||keyOf(p.name);
  p.notes=p.notes||'';
  
  let m=Math.max(0,p.seq||0,...p.tasks.map(t=>t.n||0));p.tasks.forEach((t,i)=>{if(!t.n)t.n=++m});p.seq=m;
  return p;
}
try{
  const raw=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(raw&&typeof raw==='object')Object.keys(raw).forEach(k=>{try{if(raw[k]&&typeof raw[k]==='object'){raw[k].id=raw[k].id||k;P[k]=norm(raw[k])}}catch(e){}});
  cur=localStorage.getItem(KEY+'_cur')||null;
}catch(e){P={}}
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const live=()=>Object.values(P).filter(p=>!p._deleted).sort((a,b)=>a.created<b.created?-1:1);

function chip(s){$('#chip').textContent={saving:'Saving…',live:'Synced',error:'Sync error, will retry',offline:'Offline, saved on this device'}[s]||s}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(P));localStorage.setItem(KEY+'_cur',cur||'')}catch(e){}}
function touch(p){p.updated_at=new Date().toISOString();p._dirty=1;persist();chip('saving');clearTimeout(saveT);saveT=setTimeout(sync,500)}
async function sync(){
  if(!sb)return chip('offline');
  const d=Object.values(P).filter(p=>p._dirty);if(!d.length)return chip('live');
  try{
    const {error}=await sb.from('karnel_projects').upsert(d.map(p=>{const {_dirty,...c}=p;return{id:p.id,name:p.name,data:c,updated_at:p.updated_at}}));
    if(error)throw error;d.forEach(p=>delete p._dirty);persist();chip('live');
  }catch(e){console.warn(e);chip('error')}
}
async function load(){
  if(!sb)return chip('offline');
  try{
    const {data,error}=await sb.from('karnel_projects').select('*');if(error)throw error;
    let changed=false;
    (data||[]).forEach(r=>{try{
      let d=r.data;if(typeof d==='string')d=JSON.parse(d);if(!d||typeof d!=='object')return;
      d.id=d.id||r.id;const l=P[r.id],ct=+new Date(d.updated_at||0),lt=+new Date(l?.updated_at||0);
      if(!l||ct>lt){P[r.id]=norm(d);changed=true}else if(lt>ct){l._dirty=1}
    }catch(e){}});
    const ids=new Set((data||[]).map(r=>r.id));Object.values(P).forEach(p=>{if(!ids.has(p.id))p._dirty=1});
    persist();if(changed)render();sync();listen();
  }catch(e){console.warn(e);chip('error')}
}
function listen(){
  try{if(chan)sb.removeChannel(chan);
  chan=sb.channel('karnel-live').on('postgres_changes',{event:'*',schema:'public',table:'karnel_projects'},pl=>{
    const n=pl.new,l=n&&P[n.id];
    if(n&&n.id&&n.data&&typeof n.data==='object'&&(!l||+new Date(n.data.updated_at||0)>+new Date(l.updated_at||0))){P[n.id]=norm(n.data);persist()}
    clearTimeout(rtT);rtT=setTimeout(()=>{if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()},200);
  }).subscribe()}catch(e){}
}

function openM(h,f){$('#md').innerHTML=h;$('#ovl').classList.add('on');if(f)$(f).focus()}
function closeM(){$('#ovl').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const cancel='<button type="button" class="btn" onclick="closeM()">Cancel</button>';

function openProjectForm(){openM(`<h2>Create project</h2><form onsubmit="createProject(event)">
  <label for="pn">Project Name (Site Location)</label><input class="in" id="pn" required maxlength="80" placeholder="e.g. 14 Wattle Street duplex">
  <label for="pt">Workflow</label><select class="in" id="pt"><option value="std">Standard Template (${customWorkflow.length} stages)</option><option value="blank">Blank, I'll add the stages</option></select>
  <div class="dr">${cancel}<button class="btn p">Create project</button></div></form>`,'#pn')}

function openTaskForm(){const p=P[cur];openM(`<h2>Add task / step</h2><form onsubmit="createTask(event)">
  <label>Project</label><input class="in" value="${esc(p.name)}" disabled>
  <label for="tn">Summary / Step name</label><input class="in" id="tn" required maxlength="140">
  <label for="td">Date (Optional)</label><input class="in" type="date" id="td">
  <div class="dr">${cancel}<button class="btn p">Create</button></div></form>`,'#tn')}

function openBookTask(tid){
  const t=P[cur].tasks.find(x=>x.id===tid);
  openM(`<h2>📅 Schedule Event</h2><form onsubmit="saveTaskDate(event,'${tid}')">
    <p class="meta" style="margin-bottom:12px;font-weight:600">${esc(t.text)}</p>
    <label>Select Date</label><input class="in" type="date" id="t-date" value="${t.due}">
    <div class="dr">
      ${t.due ? `<button type="button" class="btn d" style="margin-right:auto" onclick="clearTaskDate('${tid}')">Clear Date</button>` : ''}
      ${cancel}<button class="btn p">Save Date</button>
    </div></form>`,'#t-date');
}

function clearTaskDate(tid){
  const p=P[cur], t=p.tasks.find(x=>x.id===tid);
  if(t.due) syncToGoogle('delete', t, p);
  t.due = '';
  touch(p); closeM(); render();
}

function saveTaskDate(e,tid){
  e.preventDefault(); 
  const p=P[cur], t=p.tasks.find(x=>x.id===tid);
  const newDate = $('#t-date').value;
  
  if(!newDate && t.due) {
    syncToGoogle('delete', t, p); 
  } else if(newDate) {
    t.due = newDate;
    syncToGoogle('save', t, p); 
  }
  
  t.due = newDate;
  touch(p); closeM(); render();
}

function createProject(e){
  e.preventDefault();const name=$('#pn').value.trim();
  const isStd = $('#pt').value==='std';
  const tasks = isStd ? customWorkflow.map((n,i)=>({id:uid(),n:i+1,text:n,due:'',status:'todo'})) : [];
  
  const p=norm({id:'p_'+uid(),name,created:new Date().toISOString(),tasks:tasks,events:[],notes:'',contractors:[]});
  P[p.id]=p;cur=p.id;tab='board';touch(p);closeM();render();
}
function pick(id){cur=id;view='proj';q='';persist();render()}
function editProject(){const p=P[cur],n=prompt('Project name',p.name);if(n&&n.trim()){p.name=n.trim();touch(p);render()}}
function deleteProject(){const p=P[cur];if(confirm('Delete "'+p.name+'" with all its tasks and workflow?')){p._deleted=true;touch(p);render()}}
function setTab(t){tab=t;render()}

function createTask(e){
  e.preventDefault();const p=P[cur];
  const t = {id:uid(),n:++p.seq,text:$('#tn').value.trim(),due:$('#td').value,status:'todo'};
  p.tasks.push(t);
  if(t.due) syncToGoogle('save', t, p);
  touch(p);closeM();render()
}
function setStatus(tid,s){
  const p=P[cur],t=p.tasks.find(t=>t.id===tid);
  if(!t)return;
  t.status=s;
  if(t.due) syncToGoogle('save', t, p); 
  touch(p);render()
}
function updateTaskText(tid,val){
  const p=P[cur],t=p.tasks.find(t=>t.id===tid);
  if(t) { t.text=val; if(t.due) syncToGoogle('save', t, p); }
  touch(p);
}
function delTask(tid){
  const p=P[cur], t=p.tasks.find(x=>x.id===tid);
  if(t && t.due) syncToGoogle('delete', t, p);
  p.tasks=p.tasks.filter(x=>x.id!==tid);
  touch(p);render()
}
function drop(e,s){e.preventDefault();if(dragId)setStatus(dragId,s);dragId=null}
function setQ(v){q=v.toLowerCase();cols()}
function saveNote(v){P[cur].notes=v; touch(P[cur]);}

// MODIFIED: Reset to Template Function
function resetWorkflow(pid) {
  if(!confirm("Are you sure you want to replace this project's workflow with your default template? This will remove current steps, statuses, and dates.")) return;
  const p = P[pid];
  
  // Wipe dates from google calendar first
  p.tasks.forEach(t => { if(t.due) syncToGoogle('delete', t, p); });
  
  // Apply fresh template
  p.tasks = customWorkflow.map((n,i)=>({id:uid(),n:i+1,text:n,due:'',status:'todo'}));
  touch(p);
  render();
}

  <button class="pi${view==='inductions'?' on':''}" onclick="goInductions()"><span class="av" style="background:#1F845A">IN</span><span>Inductions</span></button>
  <button class="pi${view==='template'?' on':''}" onclick="goTemplate()"><span class="av" style="background:#8270DB">⚙️</span><span>Edit Workflows</span></button>
  <div class="sh" style="margin-top:16px">Projects<button onclick="openProjectForm()" aria-label="Create project">+</button></div>`+L.map(p=>`<button class="pi${view==='proj'&&p.id===cur?' on':''}" onclick="pick('${p.id}')"><span class="av" style="background:${tint(p.name)}">${esc(p.key.slice(0,2))}</span><span>${esc(p.name)}</span></button>`).join('');

  if(!cur){m.innerHTML=`<div class="empty"><h1>Create your first project</h1><p>Add a project, then set up its workflow and tasks.</p><button class="btn p" onclick="openProjectForm()">Create project</button></div>`;return}
  
  const p=P[cur];
  
  m.innerHTML=`<div class="bc">Projects / ${esc(p.name)}</div>
    <div class="th"><div><h1>${esc(p.name)}</h1><div class="meta">Key: ${esc(p.key)}</div></div>

      <div style="padding:0 16px 16px;">
        <div style="text-align:right; margin-bottom:12px"><button class="btn s p" onclick="openContractorForm('${p.id}')">+ Add Contractor</button></div>
        <div style="overflow-x:auto;">${renderContractorsTable(p)}</div>

    <div class="proj-wrap">

        <div id="body"></div>
      </div>

        <h3 style="font-size:14px; margin-bottom:8px">Project Notes</h3>

function renderProjEvents(p){
  let evs = [
    ...p.events.filter(e=>!e.done),
    ...p.tasks.filter(t=>t.due && t.status!=='done').map(t=>({id:t.id, date:t.due, time:'', title:t.text, kind:'task', who:''}))
  ];
  evs.sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
  
  if(!evs.length) return '<div class="none">No upcoming bookings.</div>';
  return evs.map(i=>`
    <div class="ai" style="padding:8px; background:#fff; border:1px solid var(--bd); border-radius:4px; margin-bottom:8px" onclick="openItem('${p.id}','${i.id}','${i.kind}')">
      <div style="font-size:11px; color:var(--sub); font-weight:600">${fmt(i.date,{month:'short',day:'numeric'})} ${i.time||''}</div>
      <div style="font-weight:500; font-size:13px; margin:2px 0">${esc(i.title)}</div>
      ${i.who?`<div style="font-size:11px; color:var(--sub)">With: ${esc(i.who)}</div>`:''}
    </div>
  `).join('');
}

function renderContractorsTable(p){
  if(!p.contractors||!p.contractors.length) return '';
  let rows = p.contractors.map(c=>`<tr>
    <td><b>${esc(c.type)}</b></td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td>
    <td style="text-align:right"><button class="btn s" onclick="delContractor('${p.id}','${c.id}')">✕</button></td>
  </tr>`).join('');
  return `<table class="c-table"><thead><tr><th>Trade / Type</th><th>Name / Company</th><th>Contact Details</th><th style="width:40px"></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function goTemplate() { view = 'template'; render(); }
function updateTmplStep(idx, val) { customWorkflow[idx] = val; saveWorkflowTmpl(); }
function addTmplStep() { customWorkflow.push('New step'); saveWorkflowTmpl(); render(); }
function delTmplStep(idx) { if(confirm('Remove this step from template?')){customWorkflow.splice(idx,1); saveWorkflowTmpl(); render();} }
function moveTmplStep(idx, dir) { 
  if(idx+dir < 0 || idx+dir >= customWorkflow.length) return;
  let temp = customWorkflow[idx]; customWorkflow[idx] = customWorkflow[idx+dir]; customWorkflow[idx+dir] = temp;
  saveWorkflowTmpl(); render();
}
function renderTemplateView() {
  const rows = customWorkflow.map((step, i) => `<tr>
    <td style="width:40px"><span class="nm">${i+1}</span></td>
    <td><input class="in" style="width:100%" value="${esc(step)}" onchange="updateTmplStep(${i}, this.value)"></td>
    <td style="width:110px">
      <div class="ib">
        <button onclick="moveTmplStep(${i},-1)">↑</button>
        <button onclick="moveTmplStep(${i},1)">↓</button>
        <button onclick="delTmplStep(${i})">✕</button>
      </div>
    </td>
  </tr>`).join('');
  
  $('#main').innerHTML = `<h1>Edit Workflow Template</h1>
    <div class="meta" style="margin-bottom:16px">Customize the default steps applied to new projects.</div>
    <div style="background:#fff; border-radius:6px; box-shadow:0 1px 1px #091E4240; overflow-x:auto;">
      <table class="tbl"><thead><tr><th>#</th><th>Step Name (Click to edit)</th><th>Order</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div style="margin-top:16px"><button class="btn p" onclick="addTmplStep()">+ Add Step</button></div>`;
}

function flow(p){
  const rows = p.tasks.sort((a,b)=>a.n-b.n).map((t,i)=>`
    <tr>
      <td style="width:40px"><span class="nm">${i+1}</span></td>
      <td><input class="in" style="width:100%; border-color:transparent; background:transparent" value="${esc(t.text)}" onchange="updateTaskText('${t.id}',this.value)"></td>
      <td style="width:140px"><select class="in s" style="width:100%" onchange="setStatus('${t.id}',this.value)">${COLS.map(([v,l])=>`<option value="${v}"${t.status===v?' selected':''}>${l}</option>`).join('')}</select></td>
      <td style="width:100px">${t.due?fmt(t.due,{month:'short',day:'numeric'}):'-'}</td>
      <td style="width:110px">
        <div class="sa"><button class="btn s" onclick="openBookTask('${t.id}')">📅 Book</button><button class="btn s" title="Delete" onclick="delTask('${t.id}')">✕</button></div>
      </td>
    </tr>
  `).join('');
  
  // MODIFIED: Reset to template button added here
  $('#body').innerHTML=`<table class="tbl"><thead><tr><th>#</th><th>Step / Description (Click to edit)</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>
  <div style="margin-top:16px; display:flex; gap:8px;">
    <button class="btn p" onclick="openTaskForm()">+ Add Extra Step</button>
    <button class="btn" onclick="resetWorkflow('${p.id}')">🔄 Reset to Template</button>
  </div>`;
}

function board(p){
  $('#body').innerHTML=`<div class="tb"><input class="in" type="search" placeholder="Search items..." aria-label="Search tasks" value="${esc(q)}" oninput="setQ(this.value)"><button class="btn p" onclick="openTaskForm()">+ Add Item</button></div><div class="board" id="cols"></div>`;
  cols();
}
function cols(){
  const p=P[cur],today=ymd(new Date());
  const list=p.tasks.filter(t=>(!q||(t.text+' '+p.key+'-'+t.n).toLowerCase().includes(q)));
  $('#cols').innerHTML=COLS.map(([k,label])=>{
    const ts=list.filter(t=>t.status===k).sort((a,b)=>a.n-b.n);
    return `<div class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${k}')"><div class="ch">${label}<span class="cnt">${ts.length}</span></div>`+ts.map(t=>{
      const od=t.due&&t.status!=='done'&&t.due<today;
      const due=t.due?fmt(t.due,{day:'numeric',month:'short'}):'';
      return `<div class="card" draggable="true" ondragstart="dragId='${t.id}'"><div class="ct">${esc(t.text)}</div>
        <div class="cm">${due?`<span class="due${od?' od':''}">${od?'Overdue ':'📅 '}${due}</span>`:''}</div>
        <div class="cf"><span><button class="btn s" onclick="openBookTask('${t.id}')">📅 Book</button></span><span><select aria-label="Status" onchange="setStatus('${t.id}',this.value)">${COLS.map(([v,l])=>`<option value="${v}"${t.status===v?' selected':''}>${l}</option>`).join('')}</select><button class="x" aria-label="Delete item" onclick="delTask('${t.id}')">×</button></span></div></div>`}).join('')+`</div>`}).join('');
}

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=(k,o)=>new Date(k+'T00:00').toLocaleDateString('en-AU',o);
const KIND={booking:['Booking','bk'],reminder:['Reminder','rm'],task:['Task due','']};
function items(pid){
  const o=[];live().forEach(p=>{if(pid&&p.id!==pid)return;
    p.events.forEach(e=>o.push({id:e.id,pid:p.id,pn:p.name,date:e.date,time:e.time,title:e.title,kind:e.kind==='booking'?'booking':'reminder',who:e.who,done:e.done}));
    p.tasks.forEach(t=>{if(t.due)o.push({id:t.id,pid:p.id,pn:p.name,date:t.due,time:'',title:t.text,kind:'task',done:t.status==='done'})})});
  return o.sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
}
const due=()=>{const lim=ymd(addD(new Date(),2));return items().filter(i=>!i.done&&i.date<=lim)};
function alerts(){
  const d=due(),b=$('#bdg'),n=$('#ban');b.textContent=d.length;b.style.display=d.length?'':'none';
  n.style.display=d.length?'flex':'none';n.innerHTML=`<span><b>${d.length}</b> ${d.length>1?'items are':'item is'} due within 2 days or overdue.</span><button class="btn s" onclick="openNotif()">View</button>`;
}
function pushNotes(){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const td=ymd(new Date());let n;try{n=JSON.parse(localStorage.getItem('karnel_notified'))}catch(e){}
    if(!n||n.d!==td)n={d:td,ids:[]};
    due().forEach(i=>{if(!n.ids.includes(i.id)){new Notification((i.date<td?'Overdue: ':i.date===td?'Today: ':'Coming up: ')+i.title,{body:i.pn+', '+fmt(i.date,{weekday:'short',day:'numeric',month:'short'})+(i.time?' at '+i.time:'')});n.ids.push(i.id)}});
    localStorage.setItem('karnel_notified',JSON.stringify(n));
  }catch(e){}
}
function askNotes(){Notification.requestPermission().then(()=>{pushNotes();openNotif()})}
function openNotif(){
  const can='Notification' in window&&Notification.permission==='default';
  openM(`<h2>Due in the next 2 days</h2><p class="meta">Includes overdue items.</p>${groups(due(),true)}${can?'<button class="btn" style="margin-top:14px" onclick="askNotes()">Turn on desktop alerts</button>':''}<div class="dr"><button class="btn" onclick="closeM()">Close</button></div>`);
}
function row(i,sp){
  const t=ymd(new Date()),c=i.date<t?' od':i.date<=ymd(addD(new Date(),2))?' soon':'',[kl,kc]=KIND[i.kind];
  return `<div class="ai${c}" onclick="openItem('${i.pid}','${i.id}','${i.kind}')"><div class="at">${i.time||'All day'}</div><div><b>${esc(i.title)}</b><div class="meta">${sp?esc(i.pn):''}${sp&&i.who?', ':''}${i.who?'with '+esc(i.who):''}</div></div><span class="lz ${kc}">${kl}</span></div>`;
}
function groups(list,sp){
  const t=ymd(new Date()),tm=ymd(addD(new Date(),1));let h='',last='';
  list.forEach(i=>{const g=i.date<t?'Overdue':i.date===t?'Today':i.date===tm?'Tomorrow':fmt(i.date,{weekday:'long',day:'numeric',month:'short'});
    if(g!==last){h+=`<div class="agh${g==='Overdue'?' red':''}">${g}</div>`;last=g}h+=row(i,sp)});
  return h||'<p class="none">Nothing scheduled.</p>';
}
const cp=i=>{const c=tint(i.pn),tk=i.kind==='task';return `<button class="chp${tk?' tk':''}${i.done?' dn2':''}" style="${tk?'color:'+c:'background:'+c}" title="${esc(i.title)}" onclick="event.stopPropagation();openItem('${i.pid}','${i.id}','${i.kind}')">${i.time?i.time+' ':''}${esc(i.title)}</button>`};
function mv(d){if(!d){const n=new Date();cy=n.getFullYear();cm=n.getMonth()}else{const x=new Date(cy,cm+d,1);cy=x.getFullYear();cm=x.getMonth()}render()}
function goCal(){view='cal';render()}
function goTask(pid){cur=pid;view='proj';tab='board';q='';render()}
function openItem(pid,id,kind){
  if(kind === 'task') {
    goTask(pid); 
    openBookTask(id); 
  } else {
    openEvent(pid,id);
  }
}

function openDayView(date){
  const its = items().filter(i=>i.date===date);
  let h = `<h2>Agenda for ${fmt(date,{weekday:'long',day:'numeric',month:'short'})}</h2>`;
  if(its.length){
    h += `<div style="max-height:50vh;overflow-y:auto;margin:16px 0;padding-right:8px">` + its.map(i=>`
      <div class="ai" style="padding:10px; background:#f7f8f9; border:1px solid #dcdfe4; border-radius:4px; margin-bottom:8px" onclick="openItem('${i.pid}','${i.id}','${i.kind}')">
        <div style="font-size:12px; font-weight:600; color:var(--blue-d); margin-bottom:4px">${esc(i.pn)}</div>
        <div style="font-weight:600">${i.time?i.time+' ':''}${esc(i.title)}</div>
        ${i.who?`<div style="font-size:12px;color:var(--sub)">With: ${esc(i.who)}</div>`:''}
      </div>`).join('') + `</div>`;
  } else {
    h += `<p class="none">No events scheduled.</p>`;
  }
  h += `<div class="dr"><button class="btn p" onclick="openEvent(null,null,'${date}','booking')">Add Booking</button><button class="btn" onclick="closeM()">Close</button></div>`;
  openM(h);
}

function calView(pid){
  const its=items(pid),first=new Date(cy,cm,1),off=(first.getDay()+6)%7,days=new Date(cy,cm+1,0).getDate(),rows=Math.ceil((off+days)/7),td=ymd(new Date()),by={};
  its.forEach(i=>(by[i.date]=by[i.date]||[]).push(i));
  let g='<div class="cg">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<rows*7;i++){const d=new Date(cy,cm,1-off+i),k=ymd(d),L=by[k]||[];
    g+=`<div class="dc${d.getMonth()!==cm?' off':''}${k===td?' td':''}" onclick="openDayView('${k}')"><span class="dn">${d.getDate()}</span>${L.slice(0,3).map(cp).join('')}${L.length>3?`<div class="more">+${L.length-3} more</div>`:''}</div>`}
  g+='</div>';
  const a=pid?`'${pid}'`:'null';
  return `<div class="tb"><button class="btn" onclick="mv(-1)" aria-label="Previous month">‹</button><button class="btn" onclick="mv(0)">Today</button><button class="btn" onclick="mv(1)" aria-label="Next month">›</button><b style="font-size:16px;margin:0 8px">${first.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</b><span class="sp"></span>
    <button class="btn" onclick="openEvent(${a},null,null,'booking')">Add booking</button><button class="btn p" onclick="openEvent(${a},null,null,'reminder')">Add reminder</button></div>
    <div class="cal"><div>${g}</div><div><h2 style="font-size:16px;font-weight:600">Agenda</h2>${groups(its.filter(i=>!i.done).slice(0,40),!pid)}</div></div>`;
}
function openEvent(pid,id,date,kind){
  const L=live();if(!L.length)return openProjectForm();
  const e=id&&P[pid]?.events.find(x=>x.id===id),pr=pid||(cur&&P[cur]&&!P[cur]._deleted?cur:L[0].id);
  const v=e||{kind:kind||'reminder',title:'',date:date||ymd(new Date()),time:'',who:'',note:'',done:false};
  openM(`<h2>${e?'Edit':'Add'} ${e?v.kind:kind||'event'}</h2><form onsubmit="saveEvent(event,'${e?pid:''}','${e?id:''}')">
    <label for="ek">Type</label><select class="in" id="ek"><option value="booking"${v.kind==='booking'?' selected':''}>Booking</option><option value="reminder"${v.kind!=='booking'?' selected':''}>Reminder</option></select>
    <label for="et">Title</label><input class="in" id="et" required maxlength="140" value="${esc(v.title)}" placeholder="e.g. Plumber rough-in, call council">
    <label for="ep">Project</label><select class="in" id="ep" ${e?'disabled':''}>${L.map(p=>`<option value="${p.id}"${p.id===pr?' selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label for="ed">Date</label><input class="in" type="date" id="ed" required value="${v.date}">
    <label for="em">Time (optional)</label><input class="in" type="time" id="em" value="${v.time}">
    <label for="ew">With (optional)</label><input class="in" id="ew" maxlength="80" value="${esc(v.who)}" placeholder="Contractor, certifier or company">
    <label for="en">Notes (optional)</label><input class="in" id="en" maxlength="200" value="${esc(v.note)}">
    ${e?`<label class="ck"><input type="checkbox" id="edn" ${v.done?'checked':''}> Mark as completed</label>`:''}
    <div class="dr">${e?`<button type="button" class="btn d" style="margin-right:auto" onclick="delEvent('${pid}','${id}')">Delete</button>`:''}${cancel}<button class="btn p">Save</button></div></form>`,'#et');
}
function saveEvent(x,pid0,id0){
  x.preventDefault();const p=P[id0?pid0:$('#ep').value];
  const d={id:id0||uid(), title:$('#et').value.trim(),kind:$('#ek').value,date:$('#ed').value,time:$('#em').value,who:$('#ew').value.trim(),note:$('#en').value.trim(),done:id0?$('#edn').checked:false};
  if(id0) Object.assign(p.events.find(e=>e.id===id0),d);
  else p.events.push(d);
  
  syncToGoogle('save', d, p);
  touch(p);closeM();render();
}
function delEvent(pid,id){
  const p=P[pid], e=p.events.find(x=>x.id===id);
  if(e) syncToGoogle('delete', e, p);
  p.events=p.events.filter(x=>x.id!==id);
  touch(p);closeM();render()
}

/* ---------- SITE INDUCTIONS LOGIC ---------- */
function goInductions() {
  view = 'inductions';
  render();
  loadInductions();
}

async function loadInductions() {
  if (!sb) return;
  const bd = $('#ind-body');
  if (bd) bd.innerHTML = '<p>Loading records...</p>';
  try {
    const { data, error } = await sb.from('site_inductions').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    indData = data || [];
    drawInductions();
  } catch (e) {
    console.error(e);
    if (bd) bd.innerHTML = '<p class="err" style="display:block">Failed to load inductions.</p>';
  }
}

function drawInductions() {
  const bd = $('#ind-body');
  if (!bd) return;
  
  const tbody = indData.length === 0 
    ? '<tr><td colspan="7" class="none" style="text-align:center">No inductions recorded yet.</td></tr>'
    : indData.map(r => {
        const dt = r.created_at ? new Date(r.created_at).toLocaleString('en-AU', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
        return `<tr><td><strong>${dt}</strong></td><td>${esc(r.job_location)}</td><td>${esc(r.company)}</td><td>${esc(r.person_name)}</td><td>${esc(r.purpose)}</td><td>${esc(r.phone_no||'-')}</td><td>${esc(r.email_id||'-')}</td></tr>`;
      }).join('');
      
  bd.innerHTML = `<div style="overflow-x:auto; background:#fff; border-radius:6px; box-shadow:0 1px 1px #091E4240"><table class="tbl"><thead><tr><th>Date & Time</th><th>Job Location</th><th>Company</th><th>Person Name</th><th>Purpose</th><th>Phone No.</th><th>Email ID</th></tr></thead><tbody>${tbody}</tbody></table></div>`;
}

function renderInductionsView() {
  $('#main').innerHTML = `<h1>Live Site Inductions</h1><div class="meta" style="margin-bottom:16px">On-site sign-ins across all active jobs.</div><div id="ind-body"><p>Loading...</p></div>`;
}

if(sb){
  sb.channel('ind-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'site_inductions'},pl=>{
    indData.unshift(pl.new);
    if(view==='inductions') drawInductions();
  }).subscribe();
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#ovl').classList.contains('on')){render();pushNotes()}});

try{render();chip(sb?'live':'offline');load();pushNotes();setInterval(()=>{alerts();pushNotes()},900000)}catch(e){showErr(e.message)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sync()});
</script>
