<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KARNEL HOMES — Site Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS — KARNEL HOMES  |  EARTHY PROFESSIONAL
============================================================ */
:root {
  --base:        #EFEBE3;
  --surface:     #FAF8F4;
  --surface-alt: #F2EDE4;
  --nav:         #221C12;
  --nav-text:    #A89880;
  --nav-active:  #FFFFFF;

  --forest:      #3D6B4F;
  --forest-lt:   #EBF2EE;
  --forest-mid:  #C4D8CC;
  --moss:        #2D5440;
  --bark:        #7A5C3A;
  --bark-lt:     #F2EBE0;
  --gold:        #A07828;
  --gold-lt:     #F5EDDA;
  --stone:       #8C8278;
  --stone-lt:    #F0EDE8;

  --text-dark:   #1A1410;
  --text-main:   #3A3028;
  --text-muted:  #6E6258;
  --text-stone:  #9C8E82;

  --border:      #DDD6CC;
  --border-dark: #C8BEB4;

  --radius-sm:   6px;
  --radius-md:   10px;
  --radius-lg:   14px;
  --radius-xl:   18px;

  --shadow-sm:   0 1px 3px rgba(60,40,20,0.08);
  --shadow-md:   0 4px 16px rgba(60,40,20,0.10);
  --shadow-lg:   0 12px 40px rgba(60,40,20,0.14);

  --ease:        cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Nunito Sans', ui-sans-serif, system-ui, -apple-system, sans-serif !important;
  background: var(--base);
  color: var(--text-main);
  min-height: 100vh;
  overflow: hidden;
}

/* ============================================================
   APP LAYOUT (SIDEBAR + MAIN CONTENT)
============================================================ */
.app-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

/* LEFT SIDEBAR */
.left-sidebar {
  width: 260px; background: var(--nav); display: flex; flex-direction: column; flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,0.06); z-index: 200; transition: transform 0.3s var(--ease);
}

.sidebar-header { padding: 24px 20px 20px; display: flex; flex-direction: column; border-bottom: 1px solid rgba(255,255,255,0.06); }
.sidebar-brand-name { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 900; color: #fff; letter-spacing: 0.08em; line-height: 1; }
.sidebar-brand-sub { font-size: 10px; font-weight: 600; color: var(--nav-text); letter-spacing: 0.12em; margin-top: 5px; }

.sidebar-section { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 6px; }
.sidebar-section.scrollable { flex: 1; overflow-y: auto; border-bottom: none; }
.sidebar-section.scrollable::-webkit-scrollbar { width: 4px; }
.sidebar-section.scrollable::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

.sidebar-label {
  font-size: 10px; font-weight: 800; color: var(--nav-text); letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}

.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 700; color: var(--nav-text); cursor: pointer;
  transition: background 0.18s var(--ease), color 0.18s var(--ease); border: 1px solid transparent;
}
.nav-link:hover { background: rgba(255,255,255,0.07); color: #fff; }
.nav-link.active { background: var(--forest); color: #fff; border-color: rgba(255,255,255,0.12); }

.project-link {
  padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--nav-text); cursor: pointer;
  transition: 0.15s; border-radius: var(--radius-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent;
}
.project-link:hover { background: rgba(255,255,255,0.07); color: #fff; }
.project-link.active { background: rgba(255,255,255,0.05); color: #fff; border-left-color: var(--forest); font-weight: 800; }

/* MAIN COLUMN */
.main-column { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--base); }

/* TOP NAVIGATION BAR */
.top-nav {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; gap: 16px; position: relative; z-index: 90;
  background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 2px 0 rgba(17,17,17,.015);
}

.mobile-menu-btn { display: none; background: transparent; border: none; font-size: 24px; color: var(--text-dark); cursor: pointer; padding: 4px; }
.top-nav-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }

.status-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 999px; letter-spacing: 0.07em; transition: 0.3s; white-space: nowrap; }
.status-chip.saved  { background: rgba(61,107,79,0.15); color: var(--forest); border: 1px solid rgba(61,107,79,0.3); }
.status-chip.saving { background: rgba(160,120,40,0.15); color: var(--gold); border: 1px solid rgba(160,120,40,0.3); }
.status-chip.live   { background: rgba(61,107,79,0.12); color: var(--forest); border: 1px solid rgba(61,107,79,0.3); }
.status-chip.offline{ background: rgba(160,120,40,0.12);color: var(--gold); border: 1px solid rgba(160,120,40,0.3); }
.status-chip.error  { background: rgba(181,64,64,0.12); color: #B54040; border: 1px solid rgba(181,64,64,0.3); }

/* PAGE SHELL */
.page-shell { flex: 1; overflow-y: auto; padding: 0 32px 60px; }

/* DASHBOARD */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
.kpi-label { font-size: 11px; font-weight: 800; color: var(--text-stone); text-transform: uppercase; letter-spacing: 0.06em; }
.kpi-val { font-size: 36px; font-weight: 900; color: var(--forest); margin-top: 8px; line-height: 1; letter-spacing: -0.02em; }
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
.dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease); cursor: pointer; }
.dash-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--border-dark); }
.dash-title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.02em; }
.dash-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: var(--forest); background: var(--forest-lt); padding: 4px 10px; border-radius: 999px; }
.dash-stats { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-stone); margin-top: 16px; }

/* HEADERS */
.project-hero { padding: 32px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.project-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.project-name-group { display: flex; align-items: center; gap: 10px; }
.project-name { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.03em; line-height: 1.1; }
.project-hero-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.progress-section { margin-top: 18px; display: flex; align-items: center; gap: 20px; }
.progress-number { font-size: 36px; font-weight: 900; color: var(--forest); letter-spacing: -0.04em; line-height: 1; flex-shrink: 0; }
.progress-detail { flex: 1; }
.progress-label { font-size: 11px; font-weight: 800; color: var(--text-stone); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.progress-track { width: 100%; max-width: 480px; background: var(--border); border-radius: 999px; height: 7px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--forest), var(--moss)); border-radius: 999px; transition: width 0.7s var(--ease); }

.content-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }

/* BUTTONS */
button { font-family: inherit; cursor: pointer; transition: 0.18s var(--ease); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 800; border: 1px solid transparent; }
.btn-primary { background: var(--forest); color: #fff; border-color: var(--moss); }
.btn-primary:hover { background: var(--moss); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(45,84,64,0.3); }
.btn-outline { background: var(--surface); border-color: var(--border); color: var(--text-main); }
.btn-outline:hover { background: var(--surface-alt); border-color: var(--border-dark); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); padding: 6px 10px; }
.btn-ghost:hover { background: var(--surface-alt); color: var(--text-main); }
.btn-danger { background: transparent; border: 1px solid transparent; color: #B54040; padding: 8px 12px; font-weight: 800;}
.btn-danger:hover { background: #FBEAEA; border-color: #F0C0C0; }
.btn-icon { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); min-width: 34px; min-height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; }
.btn-icon:hover { background: var(--border); color: var(--text-main); }
.btn-add { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 14px; font-size: 11px; font-weight: 800; color: var(--forest); }
.btn-add:hover { background: var(--forest-lt); border-color: var(--forest-mid); }

/* PANELS / TABLES */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
.panel-title { font-size: 12px; font-weight: 800; color: var(--text-stone); letter-spacing: 0.09em; text-transform: uppercase; }
.panel-body { padding: 20px; }
.trades-table { width: 100%; border-collapse: collapse; min-width: 500px; }
.trades-table th { padding: 10px 16px; font-size: 10px; font-weight: 800; color: var(--text-stone); letter-spacing: 0.09em; text-transform: uppercase; background: var(--surface-alt); border-bottom: 1px solid var(--border); text-align: left; }
.trades-table td { padding: 6px 16px; border-bottom: 1px solid rgba(0,0,0,0.04); vertical-align: middle; }
.trades-table tr:last-child td { border-bottom: none; }
.trades-table tr:hover td { background: var(--surface-alt); }
.trade-role { font-size: 12px; font-weight: 800; color: var(--bark); letter-spacing: 0.04em; text-transform: uppercase; }
.table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* TILES */
.workflow-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
.tile {
  background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; position: relative; cursor: grab;
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s; overflow: hidden; animation: tileUp 0.35s var(--ease) both;
}
@keyframes tileUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 999px 0 0 999px; background: var(--border-dark); transition: background 0.3s; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.tile:hover::before { width: 5px; }

/* Statuses */
.tile.status-locked { opacity: 0.58; }
.tile.status-locked::before { background: var(--border-dark); }
.tile.status-ready::before  { background: var(--gold); }
.tile.status-in::before     { background: var(--forest); }
.tile.status-complete::before { background: var(--moss); }
.tile.status-ready   { border-color: #E8D8A0; background: #FDFAF2; }
.tile.status-in      { border-color: var(--forest-mid); background: #F4FAF6; }
.tile.status-complete{ border-color: #B8D4C0; background: #F2F9F5; }
.drag-over { border: 2px dashed var(--forest) !important; background: var(--forest-lt) !important; transform: scale(1.01) !important; }

.tile-header { display: flex; justify-content: space-between; align-items: center; }
.step-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.06em; text-transform: uppercase; transition: 0.2s; }
.bg-locked   { background: var(--stone-lt); color: var(--stone); border: 1px solid transparent; }
.bg-ready    { background: var(--gold-lt);  color: var(--gold); border: 1px solid #E8C878; }
.bg-progress { background: var(--forest-lt); color: var(--forest); border: 1px solid var(--forest-mid); }
.bg-complete { background: #DCF0E4; color: var(--moss); border: 1px solid #AADABB; }

.tile-name { font-size: 15px; font-weight: 800; color: var(--text-dark); line-height: 1.3; display: flex; gap: 7px; align-items: flex-start; letter-spacing: -0.01em; }
.drag-handle { color: var(--border-dark); font-size: 13px; cursor: grab; flex-shrink: 0; margin-top: 1px; transition: color 0.15s; padding: 2px; }
.tile:hover .drag-handle { color: var(--stone); }
.tile-owner { font-size: 10px; font-weight: 800; color: var(--text-stone); letter-spacing: 0.05em; text-transform: uppercase; }
.project-tag { font-size: 10px; font-weight: 800; color: var(--bark); background: var(--bark-lt); padding: 3px 9px; border-radius: var(--radius-sm); border: 1px solid #DFC8A8; display: inline-block; width: fit-content; margin-bottom: 2px; }

/* INPUTS */
.tile input[type="date"], .tile textarea,
input:not([type="checkbox"]):not([type="date"]):not([type="radio"]), select, textarea {
  font-size: 13px; padding: 8px 11px; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius-sm); outline: none; width: 100%; color: var(--text-main);
  font-family: inherit; transition: 0.15s; font-weight: 600;
}
input:not([type="checkbox"]):not([type="date"]):not([type="radio"]):focus, select:focus, textarea:focus,
.tile input[type="date"]:focus { border-color: var(--forest); box-shadow: 0 0 0 3px var(--forest-lt); }
.tile textarea { resize: none; height: 36px; line-height: 1.5; transition: height 0.2s var(--ease), border-color 0.15s; }
.tile textarea:focus { height: 66px; color: var(--text-main); }
input::placeholder, textarea::placeholder { color: var(--text-stone); font-weight: 500; }
.tile input[type="date"] { padding: 5px 9px; }
.trades-table input { border-color: transparent; }

/* SMART DROPDOWNS */
.smart-btn { 
    width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 800; 
    letter-spacing: 0.04em; border: none; margin-top: 2px; transition: 0.18s var(--ease); 
    font-family: 'Nunito Sans', sans-serif;
}
select.smart-dropdown {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 12px;
    padding-right: 30px;
    text-align: left;
    cursor: pointer;
    text-transform: uppercase;
}
select.smart-dropdown.smart-complete {
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
}
select.smart-dropdown:not(:disabled):hover { transform: translateY(-1px); }

.smart-start { background: var(--gold-lt); color: var(--gold); border: 1px solid #DEC070; }
.smart-start:hover { background: #F0DFA0; }
.smart-progress { background: #E9EFF6; color: var(--fc-navy); border: 1px solid #B0C4DE; }
.smart-progress:hover { background: #D5E1F0; }
.smart-complete { background: var(--forest); color: #fff; border: 1px solid var(--moss); }
.smart-complete:hover { background: var(--moss); box-shadow: 0 4px 12px rgba(45,84,64,0.28); }
.smart-locked { background: var(--stone-lt); color: var(--stone); cursor: not-allowed; border: 1px dashed var(--border-dark); text-align: center; }

/* LISTS & PANELS */
.info-col { display: flex; flex-direction: column; gap: 16px; }
.file-panel .panel-body { padding: 16px; }
.checklist-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); transition: opacity 0.2s; }
.check-row:last-child { border-bottom: none; }
.check-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--forest); flex-shrink: 0; cursor: pointer; }
.check-text { font-size: 13px; flex: 1; word-break: break-word; color: var(--text-main); transition: text-decoration 0.2s; }
.chk-del { background: transparent; border: none; color: #B54040; font-weight: bold; cursor: pointer; padding: 2px 5px; opacity: 1; transition: opacity 0.15s; font-size: 16px; }

.section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-label { font-size: 12px; font-weight: 800; color: var(--text-stone); letter-spacing: 0.09em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.section-label .chevron { font-size: 10px; transition: transform 0.2s; }
details:not([open]) .section-label .chevron { transform: rotate(-90deg); }
details > summary { list-style: none; cursor: pointer; user-select: none; outline: none; }
details > summary::-webkit-details-marker { display: none; }

/* CALENDAR VIEW */
.cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); overflow-x: auto;}
.cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.cal-month { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.02em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; min-width: 800px; }
.cal-day-label { font-size: 11px; font-weight: 800; color: var(--text-stone); letter-spacing: 0.08em; text-transform: uppercase; text-align: center; padding-bottom: 8px; }
.cal-cell { height: 120px; border-radius: var(--radius-sm); padding: 8px; cursor: pointer; background: var(--surface-alt); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; transition: 0.18s; overflow-y: auto; scrollbar-width: none;}
.cal-cell::-webkit-scrollbar { display: none; }
.cal-cell:hover { border-color: var(--forest); box-shadow: 0 2px 8px rgba(61,107,79,0.12); transform: translateY(-1px); }
.cal-date-num { font-size: 14px; font-weight: 800; color: var(--text-main); flex-shrink: 0;}
.cal-cell.today { border-color: var(--forest); background: var(--forest-lt); }
.cal-cell.today .cal-date-num { color: var(--forest); }
.cal-event-chip {
  font-size: 11px; background: var(--forest-lt); color: var(--forest); border: 1px solid var(--forest-mid);
  padding: 5px 8px; border-radius: 4px; font-weight: 700; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; transition: 0.2s; cursor: grab; margin-bottom: 2px; flex-shrink: 0;
}
.cal-event-chip.completed { text-decoration: line-through; background: var(--stone-lt); color: var(--stone); border-color: var(--border); opacity: 0.6; }

/* MY DAY VIEW */
.day-sections { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
.priority-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; align-items: flex-start; gap: 12px; box-shadow: var(--shadow-sm); border-left: 4px solid var(--gold); margin-bottom: 12px; transition: 0.18s; }
.priority-card:hover { transform: translateX(2px); box-shadow: var(--shadow-md); }
.event-text { font-size: 14px; font-weight: 800; color: var(--text-dark); transition: 0.2s; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 56px 20px; color: var(--text-stone); font-weight: 600; background: var(--surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-dark); font-size: 14px; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(25,18,10,0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 300; padding: 16px; }
.modal-content { background: var(--surface); width: 100%; max-width: 440px; padding: 28px; border-radius: var(--radius-xl); display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-lg), 0 0 0 1px var(--border); animation: modalIn 0.22s var(--ease); }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.02em; margin-bottom: 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

/* TOASTS */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--nav); color: var(--nav-active); padding: 13px 20px; border-radius: var(--radius-md); font-size: 14px; font-weight: 700; z-index: 9999; box-shadow: var(--shadow-lg); animation: slideUp 0.28s var(--ease); }
@keyframes slideUp { from { transform: translateY(12px) translateX(100%); opacity: 0; } to { transform: translateY(0) translateX(0); opacity: 1; } }

/* VIEW HEADER */
.view-header { padding: 32px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }
.view-title { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 900; color: var(--text-dark); letter-spacing: -0.03em; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }

/* MOBILE SIDEBAR OVERLAY */
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; transition: opacity 0.3s; }
.sidebar-backdrop.open { display: block; opacity: 1; }

/* RESPONSIVE & MOBILE OPTIMIZATIONS */
@media (max-width: 1024px) {
  .left-sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    transform: translateX(-100%); box-shadow: var(--shadow-lg);
  }
  .left-sidebar.open { transform: translateX(0); }
  .mobile-menu-btn { display: block; }
  .top-nav { padding: 0 20px; }
  .content-grid { grid-template-columns: 1fr; }
  .day-sections { grid-template-columns: 1fr; }
  .info-col { flex-direction: row; flex-wrap: wrap; }
  .info-col .panel { flex: 1; min-width: 240px; }
}
@media (max-width: 768px) {
  input:not([type="checkbox"]):not([type="date"]):not([type="radio"]), 
  select, textarea { font-size: 16px !important; }

  .page-shell { padding: 0 16px 40px; }
  .top-nav { padding: 0 16px; }
  .project-name { font-size: 24px; }
  .workflow-grid { grid-template-columns: 1fr; }
  .progress-number { font-size: 28px; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .project-hero-top { flex-direction: column; align-items: stretch; gap: 16px; }
  .project-hero-actions { justify-content: flex-start; }
}
</style>
</head>

<!-- ============================================================
     JAVASCRIPT ENGINE
============================================================ -->
<script>
  // ==========================================
  // UTILITIES & GLOBALS
  // ==========================================
  function generateUUID() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id_' + Date.now().toString(36) + Math.random().toString(36).substring(2);
  }

  function escapeHTML(str) {
    if (!str && str !== 0) return '';
    return String(str).replace(/[&<>'"`]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','`':'&#96;'}[m]));
  }

  function validateInput(value, maxLength = 200) {
    if (!value || typeof value !== 'string') return '';
    return value.trim().slice(0, maxLength);
  }

  function validateURL(string) {
    try {
      const url = new URL(string);
      return ['http:','https:','microsoft-edge:'].includes(url.protocol);
    } catch (_) { return false; }
  }

  function showToast(message, isError = false) {
    const ex = document.querySelector('.toast');
    if (ex) ex.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = message;
    t.style.borderLeft = isError ? '4px solid #B54040' : '4px solid #3D6B4F';
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
  }

  function updateRolodexDatalist() {
    const list = document.getElementById('rolodex-companies');
    if (!list) return;
    list.innerHTML = '';
    rolodex.forEach(c => { if(c.trim()) list.innerHTML += `<option value="${escapeHTML(c)}">`; });
  }

  function toggleSidebar(forceClose = false) {
    const sb = document.getElementById('left-sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    if (forceClose) {
        sb.classList.remove('open');
        bd.classList.remove('open');
    } else {
        sb.classList.toggle('open');
        bd.classList.toggle('open');
    }
  }

  // Handle clicking outside modals to close them
  document.querySelectorAll('.modal-overlay').forEach(el => {
      el.addEventListener('click', e => { 
          if (e.target === el) closeModals(); 
      });
  });

  const STATUS_MAP = {
    "READY TO START": { bg: "bg-ready", tile: "status-ready" },
    "IN PROGRESS":    { bg: "bg-progress", tile: "status-in" },
    "COMPLETE":       { bg: "bg-complete", tile: "status-complete" },
    "LOCKED":         { bg: "bg-locked", tile: "status-locked" }
  };

  function getDisplayStatus(status) {
    if (status === 'READY TO START') return 'NOT STARTED';
    if (status === 'IN PROGRESS') return 'IN PROGRESS';
    if (status === 'COMPLETE') return 'COMPLETED';
    return 'LOCKED';
  }

  // ==========================================
  // STATE MANAGEMENT
  // ==========================================
  const DEFAULT_CONTRACTORS = [
    { trade:"Certifier", company:"", contact:"", email:"" },
    { trade:"Architect", company:"", contact:"", email:"" },
    { trade:"Plumber",   company:"", contact:"", email:"" },
    { trade:"Electrician", company:"", contact:"", email:"" }
  ];
  const MASTER_TEMPLATE = [
    { id:'step_cc_cdc', name:"CC / CDC Approval Received", owner:"Office", prereqs:[], status:"READY TO START", notes:"", date:"" }
  ];

  let projects       = JSON.parse(localStorage.getItem('karnel_data_final16')) || {};
  let currentProjectId = localStorage.getItem('karnel_active_final16') || null;
  let rolodex        = JSON.parse(localStorage.getItem('karnel_rolodex')) || [];
  let currentView    = localStorage.getItem('karnel_view_final16') || 'DASHBOARD';
  
  let projectModalMode = 'NEW';
  let calMonth = new Date().getMonth();
  let calYear  = new Date().getFullYear();
  let activeModalDate = null;
  let hasPendingSave = false;
  let saveTimeout;
  let showCompletedChecklist = false;

  let isDragging = false;

  // Initial State Sanitization
  if (currentProjectId && projects[currentProjectId] && projects[currentProjectId]._deleted) {
      const activeKeys = Object.keys(projects).filter(k => !projects[k]._deleted);
      currentProjectId = activeKeys[0] || null;
  }

  // ==========================================
  // SUPABASE CONFIG & SYNC
  // ==========================================
  const SUPABASE_URL = 'https://giovxsxgkdilawyxuiqb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_k9sU8tyILCmQTxAI36ufWQ__JsPNSRY'.trim(); 
  let supabaseClient = null, supabaseChannel = null;
  try { if (SUPABASE_URL.startsWith('http')) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
  catch(e) { console.error("Supabase init error:", e); }

  function updateCloudStatusChip(state) {
    const el = document.getElementById('cloud-sync-status');
    if (!el) return;
    if (state === 'saving') {
        el.className = 'status-chip saving'; el.textContent = '💾 SAVING...';
    } else if (state === 'live') {
        el.className = 'status-chip live'; el.textContent = '● LIVE SYNC';
    } else if (state === 'error') {
        el.className = 'status-chip error'; el.textContent = '⚠️ SYNC ERROR';
    } else {
        el.className = 'status-chip offline'; el.textContent = '⚠️ OFFLINE';
    }
  }

  function markProjectUpdated(projectId) {
    if (!projects[projectId]) return;
    projects[projectId].updated_at = new Date().toISOString();
    projects[projectId]._needsSync = true;
    debouncedSave();
  }

  function saveLocalStateSync() {
    hasPendingSave = false;
    try {
        localStorage.setItem('karnel_data_final16', JSON.stringify(projects));
        localStorage.setItem('karnel_active_final16', currentProjectId);
        localStorage.setItem('karnel_view_final16', currentView);
        localStorage.setItem('karnel_rolodex', JSON.stringify([...new Set(rolodex)]));
    } catch(e) {
        showToast("Local save failed (storage full?)", true);
    }
    updateRolodexDatalist();
  }

  async function saveState() {
    updateCloudStatusChip('saving');
    saveLocalStateSync();
    await syncToSupabase();
  }

  function debouncedSave() {
    hasPendingSave = true;
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveState, 500);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && hasPendingSave) {
        clearTimeout(saveTimeout);
        saveLocalStateSync(); 
        syncToSupabase(); 
    }
  });
  window.addEventListener('beforeunload', () => { if (supabaseClient && supabaseChannel) supabaseClient.removeChannel(supabaseChannel); });

  async function syncToSupabase() {
    if (!supabaseClient) { updateCloudStatusChip('offline'); return; }
    
    const projectsToSync = Object.values(projects).filter(p => p._needsSync);
    if (projectsToSync.length === 0) {
        updateCloudStatusChip('live');
        return;
    }

    try {
      const payloads = projectsToSync.map(p => {
        const { _needsSync, ...cleanData } = p; 
        return {
          id: p.id,
          name: p.name,
          data: cleanData,
          updated_at: new Date().toISOString() 
        };
      });
      
      const { error } = await supabaseClient.from('karnel_projects').upsert(payloads);
      if (error) throw error;
      
      projectsToSync.forEach(p => delete p._needsSync);
      updateCloudStatusChip('live');
    } catch(e) {
      console.warn("Sync Error: ", e);
      updateCloudStatusChip('error');
    }
  }

  async function loadFromCloud() {
    if (!supabaseClient) { updateCloudStatusChip('offline'); return false; }
    try {
      if (supabaseChannel) supabaseClient.removeChannel(supabaseChannel);
      const { data, error } = await supabaseClient.from('karnel_projects').select('*');
      if (error) throw error;
      
      let hasUpdates = false;
      if (data) {
        const cloudKeys = new Set();
        data.forEach(row => {
          let cloudData = row.data;
          if (typeof cloudData === 'string') {
              try { cloudData = JSON.parse(cloudData); } catch (err) { return; }
          }
          if (!cloudData) return;
            
          cloudKeys.add(row.id);
          const localData = projects[row.id];
          
          const cloudTime = new Date(cloudData.updated_at || 0).getTime();
          const localTime = new Date(localData?.updated_at || 0).getTime();

          if (!localData || cloudTime > localTime) {
              projects[row.id] = cloudData;
              hasUpdates = true;
          } else if (localTime > cloudTime) {
              projects[row.id]._needsSync = true;
              debouncedSave(); 
          }
        });
        
        Object.keys(projects).forEach(localId => {
            if (!cloudKeys.has(localId) && projects[localId].updated_at) {
                projects[localId]._needsSync = true;
                debouncedSave();
            }
        });
        
        updateRolodexDatalist();
        
        const activeKeys = Object.keys(projects).filter(k => !projects[k]._deleted);
        if (!currentProjectId || !projects[currentProjectId] || projects[currentProjectId]._deleted) { 
            currentProjectId = activeKeys[0] || null; 
            if (currentProjectId) localStorage.setItem('karnel_active_final16', currentProjectId);
        }
        
        if (hasUpdates) {
            localStorage.setItem('karnel_data_final16', JSON.stringify(projects));
            render();
        }
      }
      
      let realtimeRenderTimer;
      supabaseChannel = supabaseClient.channel('karnel-live');
      supabaseChannel.on('postgres_changes', { event:'*', schema:'public', table:'karnel_projects' }, payload => {
        if (payload.new && payload.new.id && payload.new.data) {
            const newData = payload.new.data;
            const oldData = projects[payload.new.id];
            const cloudTime = new Date(newData.updated_at || 0).getTime();
            const localTime = new Date(oldData?.updated_at || 0).getTime();
            
            if (cloudTime > localTime || !oldData) {
                projects[payload.new.id] = newData;
            }
        }
        
        clearTimeout(realtimeRenderTimer);
        realtimeRenderTimer = setTimeout(() => {
            const ae = document.activeElement;
            if (!isDragging && (!ae || !['INPUT','TEXTAREA','SELECT'].includes(ae.tagName))) {
                render();
            }
        }, 200);
        
      }).subscribe();
      
      updateCloudStatusChip('live');
      return true;
    } catch(e) { 
        console.error("Cloud load error:", e); 
        updateCloudStatusChip('error');
        return false; 
    }
  }

  async function manualSync() {
    const btn = document.getElementById('sync-btn');
    if (!btn) return;
    const orig = btn.textContent; btn.textContent = '⏳ Syncing…'; btn.disabled = true;
    try { 
        const ok = await loadFromCloud(); 
        if(ok) showToast("Synced successfully."); 
        else showToast("Sync returned with warnings.", true);
    }
    catch(e) { showToast("Sync failed. Check connection.", true); }
    finally { btn.textContent = orig; btn.disabled = false; }
  }

  // ==========================================
  // SIDEBAR PROJECTS & NAVIGATION
  // ==========================================
  function renderSidebarProjects() {
    const list = document.getElementById('sidebar-project-list');
    if(!list) return;
    list.innerHTML = '';
    const activeProjects = Object.values(projects).filter(p => !p._deleted);
    
    if (activeProjects.length === 0) {
      list.innerHTML = '<div style="font-size:12px;color:var(--text-stone);padding:8px 0;">No active projects</div>';
      return;
    }
    
    activeProjects.forEach(p => {
      if (!p.id) return; 
      const div = document.createElement('div');
      div.className = 'project-link' + (p.id === currentProjectId ? ' active' : '');
      div.textContent = p.name || 'Unnamed Project';
      div.onclick = () => { switchProject(p.id); };
      list.appendChild(div);
    });
  }

  function setView(v) {
    if (currentView !== v) {
      const ps = document.querySelector('.page-shell');
      if (ps) ps.scrollTo(0,0);
    }
    currentView = v;
    localStorage.setItem('karnel_view_final16', v);
    if(window.innerWidth <= 1024) toggleSidebar(true);
    render();
  }

  function switchProject(id) { 
    currentProjectId = id; 
    localStorage.setItem('karnel_active_final16', currentProjectId); 
    setView('PROJECT'); 
  }

  // ==========================================
  // CORE PROJECT FUNCTIONS
  // ==========================================
  function openProjectModal(mode) {
    const activeKeys = Object.keys(projects).filter(k => !projects[k]._deleted);
    if (mode === 'COPY' && activeKeys.length === 0) return showToast("No active project to copy.", true);
    projectModalMode = mode;
    document.getElementById('modal-project-title').innerText = mode === 'NEW' ? 'New Project' : 'Copy Project';
    document.getElementById('project-address-input').value = '';
    document.getElementById('modal-project').style.display = 'flex';
    setTimeout(() => document.getElementById('project-address-input').focus(), 80);
    if(window.innerWidth <= 1024) toggleSidebar(true);
  }

  function submitProjectModal() {
    const name = validateInput(document.getElementById('project-address-input').value);
    if (!name) return showToast("Please enter a valid address.", true);
    const timeNow = new Date().toISOString();
    
    if (projectModalMode === 'NEW') {
      const id = 'proj_' + generateUUID(); 
      projects[id] = { id, name, updated_at: timeNow, _needsSync: true, contractors: JSON.parse(JSON.stringify(DEFAULT_CONTRACTORS)), steps: JSON.parse(JSON.stringify(MASTER_TEMPLATE)), checklist: [], events: [], projectLocationLink: "" };
      currentProjectId = id;
    } else {
      const orig = projects[currentProjectId];

      currentProjectId = newId;
    }

  // ==========================================
  // WORKFLOW & TILES (DOM In-Place Updates)
  // ==========================================
  
  // Revised engine: Cascades locks dynamically down the chain 
  // if an upstream task is pulled from COMPLETE to IN PROGRESS
  function evaluateDependencies(project) {
    let anyChange = false;
    let passChanged = false;
    if (!project || !project.steps) return false;

    do {
        passChanged = false;
        project.steps.forEach(step => {
            const met = step.prereqs.length === 0 || step.prereqs.every(rId => {
                const pre = project.steps.find(s => String(s.id) === String(rId));
                return pre && pre.status === "COMPLETE";
            });

            if (met && step.status === "LOCKED") {
                step.status = "READY TO START";
                passChanged = true;
                anyChange = true;
            } else if (!met && step.status !== "LOCKED") {
                step.status = "LOCKED";
                passChanged = true;
                anyChange = true;
            }
        });
    } while (passChanged);

    if (anyChange) {
        project.updated_at = new Date().toISOString();
        project._needsSync = true;
        debouncedSave();
    }
    return anyChange;
  }

  function updateField(projectId, type, id, field, value) {
    const p = projects[projectId]; if (!p) return;

    if (type === 'contractor') {
      if (!p.contractors || !p.contractors[id]) return; 
      p.contractors[id][field] = value;
      if (field === 'company' && value.trim() && !rolodex.includes(value.trim())) rolodex.push(value.trim());
      markProjectUpdated(projectId);
    } 
    else if (type === 'step') {
      const step = p.steps.find(s => String(s.id) === String(id));
      if (step) { 
          step[field] = value; 
          markProjectUpdated(projectId);
          
          if (field === 'status') {
              evaluateDependencies(p);
              syncTilesToState(projectId);
          } 
      }
    } 
    else if (type === 'locationLink') {
      if (value && !validateURL(value)) { 
          showToast('Please enter a valid URL (http/https).', true); 
          return; 
      }
      p.projectLocationLink = value;
      markProjectUpdated(projectId);
      renderLocationLink(projectId); 
    }
  }

  function syncTilesToState(projectId) {
     const p = projects[projectId]; if(!p) return;
     
     (p.steps || []).forEach(step => {
         const tileEl = document.getElementById(`tile-${projectId}-${step.id}`);
         if (tileEl) {
             const mapping = STATUS_MAP[step.status] || STATUS_MAP["LOCKED"];
             tileEl.className = `tile ${mapping.tile}`;
             const badge = tileEl.querySelector('.step-badge');
             if(badge) { badge.className = `step-badge ${mapping.bg}`; badge.textContent = getDisplayStatus(step.status); }
             const btnContainer = tileEl.querySelector('.smart-btn-container');
             if(btnContainer) { btnContainer.innerHTML = generateSmartButton(step, projectId); }
         }
     });

     const total = p.steps ? p.steps.length : 0;
     const done = p.steps ? p.steps.filter(s => s.status === 'COMPLETE').length : 0;
     const pct = total === 0 ? 0 : Math.round((done / total) * 100);

     const numEl = document.getElementById('progress-number-val');
     const trackEl = document.getElementById('progress-bar-fill');
     const lblEl = document.getElementById('progress-label-val');
     if(numEl) numEl.textContent = pct + '%';
     if(trackEl) trackEl.style.width = pct + '%';
     if(lblEl) lblEl.textContent = `${done} of ${total} jobs complete`;
     
     const dashPct = document.getElementById(`dash-pct-${projectId}`);
     const dashBar = document.getElementById(`dash-bar-${projectId}`);
     if(dashPct) {
         dashPct.textContent = pct + '%';
         dashPct.style.background = pct === 100 ? 'var(--forest)' : 'var(--forest-lt)';
         dashPct.style.color = pct === 100 ? '#fff' : 'var(--forest)';
     }
     if(dashBar) { dashBar.style.width = pct + '%'; }
  }

  function generateTileHTML(step, projectId, projectName = null, index = 0) {
    const mapping = STATUS_MAP[step.status] || STATUS_MAP["LOCKED"];
    const tag = projectName ? `<div class="project-tag">📍 ${escapeHTML(projectName)}</div>` : '';
    const drag = currentView === 'PROJECT' ? 'true' : 'false';

    return `<div id="tile-${projectId}-${step.id}" class="tile ${mapping.tile}" style="animation-delay:${index * 0.06}s" draggable="${drag}"
      ondragstart="dragStart(event,'${step.id}')" ondragover="dragOver(event,this)" ondragleave="dragLeave(event,this)" ondrop="drop(event,'${step.id}',this)">
      ${tag}
      <div class="tile-header">
        <span class="step-badge ${mapping.bg}">${getDisplayStatus(step.status)}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="tile-owner">${escapeHTML(step.owner)}</span>
          <button class="btn-danger" style="padding:2px 6px;font-size:13px;" onclick="removeJob('${projectId}','${step.id}')">×</button>
        </div>
      </div>
      <div class="tile-name"><span class="drag-handle" title="Drag to reorder">⋮⋮</span>${escapeHTML(step.name)}</div>
      <input type="date" value="${step.date}" onchange="updateField('${projectId}','step','${step.id}','date',this.value)">
      <textarea placeholder="Quick notes…" oninput="updateField('${projectId}','step','${step.id}','notes',this.value)">${escapeHTML(step.notes)}</textarea>
      <div class="smart-btn-container">${generateSmartButton(step, projectId)}</div>
    </div>`;
  }

  function generateSmartButton(step, projectId) {
    if (step.status === 'LOCKED') {
        return `<select class="smart-btn smart-locked" disabled><option>🔒 Locked</option></select>`;
    }

    const isReady = step.status === 'READY TO START' ? 'selected' : '';
    const isInProg = step.status === 'IN PROGRESS' ? 'selected' : '';
    const isComp = step.status === 'COMPLETE' ? 'selected' : '';

    let colorClass = 'smart-start';
    if (step.status === 'IN PROGRESS') colorClass = 'smart-progress';
    if (step.status === 'COMPLETE') colorClass = 'smart-complete';

    return `
    <select class="smart-btn ${colorClass} smart-dropdown" onchange="updateField('${projectId}','step','${step.id}','status',this.value)">
        <option value="READY TO START" ${isReady}>Not Started</option>
        <option value="IN PROGRESS" ${isInProg}>In Progress</option>
        <option value="COMPLETE" ${isComp}>Completed</option>
    </select>
    `;
  }

  function removeJob(projectId, stepId) {
    if (!confirm("Delete this job?")) return;

    p.steps = (p.steps || []).filter(s => String(s.id) !== String(stepId));
    p.steps.forEach(s => { s.prereqs = s.prereqs.filter(id => String(id) !== String(stepId)); });

  function dragStart(e, stepId) { 
      if (currentView !== 'PROJECT') { e.preventDefault(); return; } 
      isDragging = true;
      e.dataTransfer.effectAllowed = 'move'; 
      e.dataTransfer.setData('text/plain', String(stepId)); 
  }
  function dragOver(e, el) { e.preventDefault(); el.classList.add('drag-over'); }
  function dragLeave(e, el) { 
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over'); 
  }
  function drop(e, targetId, el) {
    e.preventDefault(); el.classList.remove('drag-over');
    isDragging = false;
    const draggedId = e.dataTransfer.getData('text/plain');
    if (!draggedId || String(draggedId) === String(targetId) || currentView !== 'PROJECT') return;
    const p = projects[currentProjectId]; if(!p || !p.steps) return;
    
    const fi = p.steps.findIndex(s => String(s.id) === String(draggedId));
    const ti = p.steps.findIndex(s => String(s.id) === String(targetId));
    if (fi === -1 || ti === -1) return;
    
    p.steps.splice(ti, 0, p.steps.splice(fi, 1)[0]);
    markProjectUpdated(currentProjectId);
    render();
  }
  document.addEventListener('dragend', () => isDragging = false);

  function updateChecklistStatus(event, projectId, id, status) {
    const p = projects[projectId]; if(!p || !p.checklist) return;
    const item = p.checklist.find(i => String(i.id) === String(id));
    if (item) { 
        item.status = status;

    renderChecklist(projectId);

  function toggleCompletedChecklist() {
      showCompletedChecklist = !showCompletedChecklist;
      renderChecklist(currentProjectId);
  }

  function renderChecklist(projectId) {
      const container = document.getElementById('checklist-container');
      if (!container) return;
      const p = projects[projectId]; if(!p) return;
      
      const pending = (p.checklist||[]).filter(it => it.status !== 'COMPLETED');
      const completed = (p.checklist||[]).filter(it => it.status === 'COMPLETED');

      let html = '';
      pending.forEach(it => {
          html += `<div class="check-item">
            <input type="checkbox" onchange="updateChecklistStatus(event, '${p.id}','${it.id}','COMPLETED')">
            <div class="check-text">${escapeHTML(it.text)}</div>
            <button type="button" class="chk-del" onclick="deleteChecklistItem('${p.id}','${it.id}')">×</button>
          </div>`;
      });
      
      if (completed.length > 0) {
          if (showCompletedChecklist) {
              html += `<div style="margin: 12px 0 8px; font-size: 10px; font-weight: 800; color: var(--text-stone); text-transform: uppercase;">Completed</div>`;
              completed.forEach(it => {
                  html += `<div class="check-item" style="opacity:0.45;">
                    <input type="checkbox" checked onchange="updateChecklistStatus(event, '${p.id}','${it.id}','PENDING')">
                    <div class="check-text" style="text-decoration:line-through;">${escapeHTML(it.text)}</div>
                    <button type="button" class="chk-del" onclick="deleteChecklistItem('${p.id}','${it.id}')">×</button>
                  </div>`;
              });
              html += `<button type="button" class="btn-ghost" style="margin-top: 12px; width: 100%; text-align: center;" onclick="toggleCompletedChecklist()">Hide completed</button>`;
          } else {
              html += `<button type="button" class="btn-ghost" style="margin-top: 12px; width: 100%; text-align: center; border: 1px dashed var(--border);" onclick="toggleCompletedChecklist()">Show ${completed.length} completed</button>`;
          }
      }

      if (!pending.length && !completed.length) { html = '<div style="font-size:12px;color:var(--text-stone);">No tasks yet.</div>'; }
      container.innerHTML = html;
  }

  function renderLocationLink(projectId) {

    const activeProjects = Object.values(projects).filter(p => !p._deleted);

      (project.events || []).forEach(ev => {

          <div style="flex:1;">
            <div class="event-text" style="font-size:13px;font-weight:700;${done?'text-decoration:line-through;':''}">${escapeHTML(ev.text)}</div>
            <div style="font-size:10px;color:var(--text-stone);font-weight:700;margin-top:2px;">📍 ${escapeHTML(project.name)}</div>

  function toggleEventStatusDOM(event, projectId, eventId) {
    if (isDragging) return; // Prevent accidental toggles mid-drag
    
    const p = projects[projectId]; if(!p || !p.events) return;
    const ev = p.events.find(e => String(e.id) === String(eventId));
    if (ev) { 
        ev.status = ev.status === 'COMPLETED' ? 'PENDING' : 'COMPLETED'; 
        markProjectUpdated(projectId);
        
        const checkbox = event.target;
        let row = checkbox.closest('.event-list-item');
        if(!row) row = checkbox.closest('.priority-card');
        if(!row) row = checkbox.closest('.cal-event-chip'); 
        
        if(row) {
            let text = row.querySelector('.event-text') || row.querySelector('b');
            
            if (ev.status === 'COMPLETED') {
                row.style.opacity = '0.5';
                if(row.classList.contains('priority-card')) row.style.borderLeft = '1px solid var(--border)';
                else row.style.borderLeft = '1px solid var(--border)';
                if(text) text.style.textDecoration = 'line-through';
                if(row.classList.contains('cal-event-chip')) row.classList.add('completed');
            } else {
                row.style.opacity = '1';
                if(row.classList.contains('priority-card')) row.style.borderLeft = '4px solid var(--gold)';
                else row.style.borderLeft = '3px solid var(--forest)';
                if(text) text.style.textDecoration = 'none';
                if(row.classList.contains('cal-event-chip')) row.classList.remove('completed');
            }
        }
        
        if(!activeModalDate) render();
    }
  }

  // ==========================================
  // CALENDAR DRAG & DROP
  // ==========================================
  function dragAgendaStart(e, projectId, eventId) { 
      if (currentView !== 'CALENDAR') { e.preventDefault(); return; } 
      isDragging = true;
      e.dataTransfer.effectAllowed = 'move'; 
      e.dataTransfer.setData('text/plain', JSON.stringify({ p: projectId, e: eventId })); 
      e.stopPropagation(); 
  }
  function dragAgendaOver(e, el) { 
      e.preventDefault(); 
      el.classList.add('drag-over'); 
  }
  function dragAgendaLeave(e, el) { 
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over'); 
  }
  function dropAgenda(e, dateStr, el) {
    e.preventDefault(); 
    el.classList.remove('drag-over');
    isDragging = false;
    
    try {
        const payload = JSON.parse(e.dataTransfer.getData('text/plain'));
        if (!payload || !payload.p || !payload.e) return;
        
        const p = projects[payload.p]; if(!p || !p.events) return;
        const ev = p.events.find(x => String(x.id) === String(payload.e));
        if (ev) {
            ev.date = dateStr;
            markProjectUpdated(payload.p);
            render(); 
        }
    } catch(err) {
        console.warn("Invalid drop data");
    }
  }

  // ==========================================
  // RENDER ENGINE
  // ==========================================
  function render() {
    // Failsafe for invalid view state
    if (!['DASHBOARD','PROJECT','DAY','CALENDAR'].includes(currentView)) {
        currentView = 'DASHBOARD';
    }

    const header  = document.getElementById('portal-header');
    const content = document.getElementById('portal-content');

    ['DASHBOARD','PROJECT','DAY','CALENDAR'].forEach(k => {
      const el = document.getElementById('nav-' + k.toLowerCase());
      if (el) el.className = 'nav-link' + (currentView === k ? ' active' : '');
    });

    renderSidebarProjects();

    const activeProjects = Object.values(projects).filter(p => !p._deleted);

    // Empty state failsafe
    if (activeProjects.length === 0) {
      header.innerHTML = `<div class="view-header"><div class="view-title">Welcome to Field Command</div></div>`;
      content.innerHTML = `<div class="empty-state" style="margin-top:40px;">No active projects.<br><br>Click <b>+ New</b> in the sidebar to begin.</div>`;
      return;
    }

    // ---- DASHBOARD ----
    if (currentView === 'DASHBOARD') {
      header.innerHTML = `<div class="view-header"><div class="view-title">Dashboard</div><button id="sync-btn" class="btn btn-outline" onclick="manualSync()">🔄 Sync</button></div>`;
      
      let totalProjects = activeProjects.length;
      let totalActive = 0;
      let totalPendingMinor = 0;
      let totalBlocked = 0;

      let gridHtml = `<div class="dashboard-grid">`;

      activeProjects.forEach(p => {
        let steps = p.steps || [];
        let done = steps.filter(s => s?.status === 'COMPLETE').length;
        let pct = steps.length ? Math.round((done / steps.length) * 100) : 0;
        let active = steps.filter(s => s?.status === 'IN PROGRESS' || s?.status === 'READY TO START').length;
        let blocked = steps.filter(s => s?.status === 'LOCKED').length;
        let minor = (p.checklist || []).filter(c => c?.status === 'PENDING').length;

        totalActive += active;
        totalBlocked += blocked;
        totalPendingMinor += minor;

        gridHtml += `
          <div class="dash-card" onclick="switchProject('${p.id}')">
            <div class="dash-title">
              ${escapeHTML(p.name)}
              <span id="dash-pct-${p.id}" class="dash-pct" style="color: ${pct === 100 ? '#fff' : 'var(--forest)'}; background: ${pct === 100 ? 'var(--forest)' : 'var(--forest-lt)'}">${pct}%</span>
            </div>
            <div class="progress-track" style="max-width: 100%;"><div id="dash-bar-${p.id}" class="progress-bar" style="width:${pct}%"></div></div>
            <div class="dash-stats">
              <span>${active} Active Workflows</span>
              <span>${minor} Minor Tasks</span>
            </div>
          </div>
        `;
      });
      gridHtml += `</div>`;

      let kpiHtml = `
        <div class="kpi-row">
          <div class="kpi-card">
            <div class="kpi-label">Total Projects</div>
            <div class="kpi-val" style="color: var(--text-dark);">${totalProjects}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Active Workflows</div>
            <div class="kpi-val" style="color: var(--moss);">${totalActive}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Pending Minor Tasks</div>
            <div class="kpi-val" style="color: var(--bark);">${totalPendingMinor}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Blocked / Locked</div>
            <div class="kpi-val" style="color: var(--stone);">${totalBlocked}</div>
          </div>
        </div>
      `;

      content.innerHTML = kpiHtml + `<div class="section-row" style="margin-bottom: 16px; font-size: 14px;"><div class="section-label">Project Portfolio</div></div>` + gridHtml;
      return;
    }

    // ---- CALENDAR ----
    if (currentView === 'CALENDAR') {
      header.innerHTML = `<div class="view-header"><div class="view-title">Calendar</div><button id="sync-btn" class="btn btn-outline" onclick="manualSync()">🔄 Sync</button></div>`;
      const fd = new Date(calYear, calMonth, 1).getDay();
      const dm = new Date(calYear, calMonth + 1, 0).getDate();
      const today = new Date();
      const mn = new Date(calYear, calMonth).toLocaleString('default', { month:'long' });
      let html = `<div class="cal-wrap"><div class="cal-nav">
        <button class="btn btn-outline" onclick="changeMonth(-1)">◀ Previous</button>
        <div class="cal-month">${mn} ${calYear}</div>
        <button class="btn btn-outline" onclick="changeMonth(1)">Next ▶</button>
      </div><div class="cal-grid">`;
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += `<div class="cal-day-label">${d}</div>`; });
      for (let i = 0; i < fd; i++) html += '<div></div>';
      for (let day = 1; day <= dm; day++) {
        const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const isToday = day === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
        let evs = '';
        activeProjects.forEach(p => { 
            (p.events||[]).forEach(ev => { 
                if (ev.date === ds) {
                    evs += `<div class="cal-event-chip ${ev.status==='COMPLETED'?'completed':''}" 
                              draggable="true" 
                              ondragstart="dragAgendaStart(event, '${p.id}', '${ev.id}')"
                              onclick="(function(e){e.stopPropagation(); toggleEventStatusDOM(e, '${p.id}','${ev.id}')})(event)" 
                              title="${escapeHTML(p.name)}: ${escapeHTML(ev.text)}"><b>${escapeHTML(p.name.substring(0,5))}..</b>: ${escapeHTML(ev.text)}</div>`;
                }
            }); 
        });
        html += `<div class="cal-cell${isToday?' today':''}" 
                      onclick="if(!isDragging) openCalendarModal('${ds}')"
                      ondragover="dragAgendaOver(event, this)"
                      ondragleave="dragAgendaLeave(event, this)"
                      ondrop="dropAgenda(event, '${ds}', this)">
                      <div class="cal-date-num">${day}</div>${evs}
                 </div>`;
      }
      html += '</div></div>';
      content.innerHTML = html;
      return;
    }

    // ---- MY DAY ----
    if (currentView === 'DAY') {
      header.innerHTML = `<div class="view-header"><div class="view-title">My Day</div><button id="sync-btn" class="btn btn-outline" onclick="manualSync()">🔄 Sync</button></div>`;
      const today = new Date();
      const cap = new Date(today); cap.setDate(cap.getDate() + 2);

      let priorityHtml = '';
      let pc = 0;
      activeProjects.forEach(p => {
        (p.events||[]).forEach(ev => {
          if (ev.status === 'COMPLETED') return;
          const ed = new Date(ev.date + 'T00:00:00');
          if (ed <= cap) {
            pc++;
            const ds = ed.toLocaleDateString('en-AU', { weekday:'short', month:'short', day:'numeric' });
            priorityHtml += `<div class="priority-card">
              <input type="checkbox" onchange="(function(e){e.stopPropagation(); toggleEventStatusDOM(e, '${p.id}','${ev.id}')})(event)" style="width:16px;height:16px;flex-shrink:0;margin-top:2px;">
              <div style="flex:1;">
                <div class="event-text" style="font-size:13px;font-weight:700;color:var(--text-dark);">${escapeHTML(ev.text)}</div>
                <div style="font-size:11px;color:var(--text-stone);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;">
                  <span style="background:var(--gold-lt);color:var(--gold);padding:2px 8px;border-radius:999px;font-weight:700;border:1px solid #DEC070;">🗓️ ${ds}</span>
                  <span style="color:var(--bark);font-weight:700;">📍 ${escapeHTML(p.name)}</span>
                </div>
              </div>
            </div>`;
          }
        });
      });

      let checklist = `<div class="panel"><div class="panel-header"><div class="panel-title">Global Minor Tasks</div></div><div class="panel-body" style="padding:12px 16px;">`;
      let tc = 0;
      activeProjects.forEach(p => {
        const pending = (p.checklist||[]).filter(i => i?.status==='PENDING');
        if (pending.length) {
          checklist += `<div style="font-size:10px;font-weight:800;color:var(--bark);background:var(--bark-lt);padding:3px 8px;border-radius:4px;border:1px solid #DFC8A8;display:inline-block;margin-bottom:6px;margin-top:8px;">📍 ${escapeHTML(p.name)}</div>`;
          pending.forEach(it => { tc++; checklist += `<div class="check-row"><input type="checkbox" onchange="updateChecklistStatus(event, '${p.id}','${it.id}','COMPLETED')"><div class="check-text">${escapeHTML(it.text)}</div></div>`; });
        }
      });
      if (!tc) checklist += `<div style="font-size:12px;color:var(--text-stone);padding:8px 0;">All tasks clear!</div>`;
      checklist += '</div></div>';

      let tiles = ''; let ac = 0;
      activeProjects.forEach(p => { (p.steps || []).forEach((s,i) => { if (s?.status==='READY TO START'||s?.status==='IN PROGRESS') { tiles += generateTileHTML(s, p.id, p.name, ac++); } }); });

      content.innerHTML = `<div class="day-sections">
        <div>
          <div class="section-row" style="margin-bottom:14px;"><div class="section-label">Priority Bookings <span style="font-size:10px;color:var(--gold);font-weight:600;text-transform:none;letter-spacing:0;">(within 48 hrs)</span></div></div>
          ${pc ? priorityHtml : '<div style="font-size:13px;color:var(--text-stone);margin-bottom:20px;">No upcoming priority bookings.</div>'}
          <div class="section-row" style="margin-top:24px;margin-bottom:4px;"><div class="section-label">Active Workflow</div></div>
          <div class="workflow-grid">${tiles || '<div class="empty-state" style="grid-column:1/-1;">All caught up! No active tiles today.</div>'}</div>
        </div>
        <div>${checklist}</div>
      </div>`;
      return;
    }

    // ---- PROJECT VIEW ----
    if (!currentProjectId || !projects[currentProjectId] || projects[currentProjectId]._deleted) { 
        currentProjectId = activeProjects.length > 0 ? activeProjects[0].id : null; 
    }
    if (!currentProjectId) return;

    const p = projects[currentProjectId];
    p.steps = p.steps || [];
    p.contractors = p.contractors || [];
    p.checklist = p.checklist || [];
    p.events = p.events || [];

    const total = p.steps.length;
    const done  = p.steps.filter(s => s?.status === 'COMPLETE').length;
    const pct   = total === 0 ? 0 : Math.round((done / total) * 100);
    const todayStr = new Date().toISOString().split('T')[0];

    header.innerHTML = `
      <div class="project-hero">
        <div class="project-hero-top">
          <div class="project-name-group">
            <div class="project-name">${escapeHTML(p.name)}</div>
            <button class="btn-icon" onclick="editProjectName()" title="Edit">✏️</button>
          </div>
          <div class="project-hero-actions">
            <button class="btn btn-primary" onclick="openCalendarModal('${todayStr}','${p.id}')">📅 Book Agenda</button>
            <button id="sync-btn" class="btn btn-outline" onclick="manualSync()">🔄 Sync</button>
            <button class="btn btn-outline" onclick="openProjectModal('COPY')">📋 Copy</button>
            <button class="btn btn-outline" onclick="exportBackupData()">💾 Backup</button>
            <button class="btn btn-danger" onclick="deleteCurrentProject()">🗑️ Delete</button>
          </div>
        </div>
        <div class="progress-section">
          <div id="progress-number-val" class="progress-number">${pct}%</div>
          <div class="progress-detail">
            <div id="progress-label-val" class="progress-label">${done} of ${total} jobs complete</div>
            <div class="progress-track"><div id="progress-bar-fill" class="progress-bar" style="width:${pct}%"></div></div>
          </div>
        </div>
      </div>`;

    content.innerHTML = `
      <div class="content-grid">
        <!-- LEFT: main workspace -->
        <div>
          <!-- Trades -->
          <details open>
            <summary>
              <div class="section-row" style="margin-bottom:12px;">
                <div class="section-label"><span class="chevron">▼</span> Project Directory / Trades</div>
                <button class="btn-add" onclick="event.preventDefault();openTradeModal()">+ Add Trade</button>
              </div>
            </summary>
            <div class="panel" style="margin-bottom:24px;">
              <div class="table-responsive">
                <table class="trades-table">
                  <thead><tr><th>Trade</th><th>Company</th><th>Contact</th><th>Email</th><th style="width:36px;"></th></tr></thead>
                  <tbody>
                    ${p.contractors.map((c,i) => `<tr>
                      <td><span class="trade-role">${escapeHTML(c.trade)}</span></td>
                      <td><input type="text" list="rolodex-companies" placeholder="Company" value="${escapeHTML(c.company)}" oninput="updateField('${p.id}','contractor',${i},'company',this.value)"></td>
                      <td><input type="text" placeholder="Contact" value="${escapeHTML(c.contact)}" oninput="updateField('${p.id}','contractor',${i},'contact',this.value)"></td>
                      <td><input type="email" placeholder="Email" value="${escapeHTML(c.email)}" onchange="validateEmailInline(this, '${p.id}', ${i})"></td>
                      <td><button class="btn-danger" style="padding:3px 7px;font-size:13px;" onclick="removeTrade(${i})">×</button></td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </details>

          <!-- Workflow -->
          <details open>
            <summary>
              <div class="section-row" style="border-top:1px solid var(--border);padding-top:20px;margin-bottom:4px;">
                <div class="section-label"><span class="chevron">▼</span> Workflow Sequence</div>
                <button class="btn-add" onclick="event.preventDefault();openJobModal()">+ Add Job</button>
              </div>
            </summary>
            <div class="workflow-grid">
              ${p.steps.map((s,i) => generateTileHTML(s, p.id, null, i)).join('')}
            </div>
          </details>
        </div>

        <!-- RIGHT: info panels -->
        <div class="info-col">
          <!-- File location -->
          <div class="panel file-panel">
            <div class="panel-header"><div class="panel-title">📂 File Location</div></div>
            <div class="panel-body" id="location-link-container"></div>
          </div>

          <!-- Minor tasks -->
          <div class="panel">
            <div class="panel-header"><div class="panel-title">✅ Minor Tasks</div></div>
            <div class="panel-body">
              <div style="display:flex;gap:8px;margin-bottom:12px;">
                <input type="text" id="new-check-text" placeholder="Add task & press Enter…" style="flex:1;">
                <button class="btn btn-primary" onclick="addChecklistItem()" style="white-space:nowrap;padding:8px 12px;">+ Add</button>
              </div>
              <div id="checklist-container"></div>
            </div>
          </div>
        </div>
      </div>`;

      renderChecklist(currentProjectId);
      renderLocationLink(currentProjectId);
  }

  // ---- BOOT ----
  updateRolodexDatalist();
  updateCloudStatusChip('live');
  render();
  loadFromCloud();
</script>
</body>
</html>
