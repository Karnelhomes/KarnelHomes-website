
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARNEL HOMES - Site Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --text-main: #0f172a;
    --text-muted: #64748b;
    --bg-light: #f8fafc;
    --glass-border: rgba(203, 213, 225, 0.5);
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    
    --color-ready: #f59e0b;
    --color-progress: #0ea5e9;
    --color-complete: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body { background: var(--bg-light); color: var(--text-main); padding: 20px; }

  /* App Layout */
  .app-layout { display: flex; gap: 24px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
  .left-sidebar { flex: 0 0 260px; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 15px; }
  .main-content { flex: 1; min-width: 0; }

  @media (max-width: 900px) {
    .app-layout { flex-direction: column; }
    .left-sidebar { position: static; width: 100%; }
  }

  .card { background: #ffffff; border: 1px solid var(--glass-border); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; }
  
  /* Top Navigation */
  .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
  .view-toggle { display: flex; background: #e2e8f0; border-radius: 8px; padding: 4px; }
  .view-btn { padding: 8px 16px; border: none; background: transparent; font-weight: 600; font-size: 13px; border-radius: 6px; cursor: pointer; color: var(--text-muted); }
  .view-btn.active { background: #ffffff; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

  /* Controls */
  input, select, textarea { font-size: 13px; padding: 10px 14px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; outline: none; width: 100%; transition: 0.2s; }
  input:focus, textarea:focus { border-color: #94a3b8; }
  button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
  
  .btn-action-bar { background: #e2e8f0; color: #0f172a; padding: 8px 14px; font-size: 12px; }
  .btn-action-bar:hover { background: #cbd5e1; }
  .btn-delete { background: #fee2e2; color: #ef4444; padding: 8px 14px; font-size: 12px; }
  .btn-delete:hover { background: #fecaca; }

  .btn-primary { background: #0f172a; color: #fff; }
  .btn-primary:hover { background: #334155; }
  .btn-success { background: var(--color-complete); color: #fff; }
  
  .section-title { font-size: 14px; font-weight: 700; margin: 30px 0 15px 0; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; display: flex; align-items: center; }
  .btn-add-small { padding: 4px 10px; font-size: 11px; margin-left: 12px; background: #e2e8f0; color: #0f172a; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; }
  .btn-add-small:hover { background: #cbd5e1; }

  /* Contractors */
  .contractors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .contractor-card input { margin-bottom: 8px; padding: 8px; font-size: 12px; }
  .contractor-card .trade-title { font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .del-btn-icon { cursor: pointer; color: #ef4444; font-size: 14px; font-weight: bold; }

  /* Tiles Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .tile { display: flex; flex-direction: column; gap: 12px; position: relative; transition: 0.2s; }
  .tile.status-locked { opacity: 0.5; background: #f8fafc; }
  .tile.status-ready { border: 2px solid var(--text-main); }
  
  .tile-header { display: flex; justify-content: space-between; align-items: center; }
  .step-badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
  .bg-locked { background: #e2e8f0; color: var(--text-muted); }
  .bg-ready { background: #fef3c7; color: #b45309; }
  .bg-progress { background: #e0f2fe; color: #0369a1; }
  .bg-complete { background: #dcfce3; color: #166534; }

  .tile-title { font-size: 16px; font-weight: 700; }
  .project-tag { font-size: 11px; color: var(--color-progress); font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  
  .tile-meta { display: flex; gap: 8px; }
  .tile-meta input[type="date"] { padding: 6px 10px; font-size: 11px; }
  .doc-link-input { display: flex; gap: 5px; }
  .doc-btn { background: #e2e8f0; color: #0f172a; padding: 6px 10px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .tile textarea { height: 50px; font-size: 12px; resize: none; padding: 8px; }
  
  .smart-btn { width: 100%; padding: 12px; margin-top: auto; font-size: 14px; font-weight: 700; border-radius: 8px; text-align: center; border: none; cursor: pointer; transition: 0.2s; }
  .btn-locked { background: transparent; color: var(--text-muted); border: 1px dashed #cbd5e1; cursor: not-allowed; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; }
  
  /* Checkbox Styles */
  .check-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; gap: 8px; transition: 0.2s; }
  .check-item:hover .chk-del { opacity: 1; }
  .check-item input[type="checkbox"] { width: 14px; height: 14px; margin: 0; cursor: pointer; }
  .check-text { font-size: 12px; flex: 1; color: var(--text-main); }
  .chk-del { opacity: 0; color: #ef4444; font-size: 16px; font-weight: bold; cursor: pointer; border: none; background: transparent; padding: 0 4px; transition: 0.2s; }

  /* Modals */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; }
  .modal-content { background: #fff; width: 100%; max-width: 400px; padding: 24px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .modal-title { font-weight: 800; font-size: 16px; margin-bottom: 5px; text-transform: uppercase; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

</style>
</head>
<body>

<datalist id="rolodex-companies"></datalist>

<!-- Add Job Modal -->
<div class="modal-overlay" id="modal-job">
  <div class="modal-content">
    <div class="modal-title">Add New Job Tile</div>
    <input type="text" id="new-job-name" placeholder="Job Title (e.g. Pool Excavation)">
    <select id="new-job-owner">
      <option value="Site">Owner: Site</option>
      <option value="Office">Owner: Office</option>
    </select>
    <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-top: 5px;">Activate After:</div>
    <select id="new-job-prereq"></select>
    <div class="modal-actions">
      <button class="btn-delete" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="addJob()">Add Job</button>
    </div>
  </div>
</div>

<!-- Add Trade Modal -->
<div class="modal-overlay" id="modal-trade">
  <div class="modal-content">
    <div class="modal-title">Add New Trade</div>
    <input type="text" id="new-trade-role" placeholder="Trade / Role (e.g. Concreter)">
    <input type="text" id="new-trade-company" placeholder="Company Name">
    <input type="text" id="new-trade-contact" placeholder="Contact Name">
    <input type="email" id="new-trade-email" placeholder="Email Address">
    <div class="modal-actions">
      <button class="btn-delete" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="addTrade()">Add Trade</button>
    </div>
  </div>
</div>

<div class="app-layout">
  
  <aside class="left-sidebar card" id="sidebar-content">
    <!-- Checklist renders here -->
  </aside>

  <main class="main-content">
    <div class="top-nav">
      <div>
        <div class="logo">KARNEL HOMES</div>
        <div style="font-size: 12px; color: var(--text-muted);">Site Management Portal</div>
      </div>
      
      <div class="view-toggle">
        <button class="view-btn active" id="view-project-btn" onclick="setView('PROJECT')">🏢 Project View</button>
        <button class="view-btn" id="view-day-btn" onclick="setView('DAY')">☀️ My Day</button>
      </div>

      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;" id="project-controls">
        <select id="project-selector" onchange="switchProject(this.value)" style="width: auto; padding: 8px;"></select>
        <button class="btn-action-bar" onclick="createNewProject()">+ New Project</button>
        <button class="btn-action-bar" onclick="duplicateCurrentProject()">📋 Copy</button>
        <button class="btn-action-bar" onclick="exportBackupData()">💾 Backup</button>
        <button class="btn-delete" onclick="deleteCurrentProject()">🗑️ Delete</button>
      </div>
    </div>

    <div id="portal-content"></div>
  </main>
</div>

<script>
  const DEFAULT_CONTRACTORS = [
    { trade: "Certifier", company: "", contact: "", email: "" },
    { trade: "Architect", company: "", contact: "", email: "" },
    { trade: "Plumber", company: "", contact: "", email: "" },
    { trade: "Electrician", company: "", contact: "", email: "" }
  ];

  const MASTER_TEMPLATE = [
    { id: 1, name: "CC / CDC Approval Received", owner: "Office", prereqs: [], status: "READY TO START", notes: "", date: "", docLink: "" },
    { id: 2, name: "Send Arch Plans to Sandeep", owner: "Office", prereqs: [1], status: "LOCKED", notes: "", date: "", docLink: "" },
    { id: 3, name: "Site Setup & Temp Fencing", owner: "Site", prereqs: [1], status: "LOCKED", notes: "", date: "", docLink: "" }
  ];

  let projects = JSON.parse(localStorage.getItem('karnel_data_final3')) || {};
  let currentProjectId = localStorage.getItem('karnel_active_final3') || null;
  let rolodex = JSON.parse(localStorage.getItem('karnel_rolodex')) || [];
  let currentView = 'PROJECT'; 

  function saveState() {
    localStorage.setItem('karnel_data_final3', JSON.stringify(projects));
    localStorage.setItem('karnel_active_final3', currentProjectId);
    localStorage.setItem('karnel_rolodex', JSON.stringify([...new Set(rolodex)])); 
    updateRolodexDatalist();
  }

  function updateRolodexDatalist() {
    const list = document.getElementById('rolodex-companies');
    list.innerHTML = '';
    rolodex.forEach(company => {
      if(company.trim()) list.innerHTML += `<option value="${company}">`;
    });
  }

  // --- EXPORT BACKUP LOGIC ---
  function exportBackupData() {
    const backupData = {
      timestamp: new Date().toISOString(),
      projects: projects,
      rolodex: rolodex
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `Karnel_Homes_Backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(dlAnchorElem);
    dlAnchorElem.click();
    dlAnchorElem.remove();
  }

  function createNewProject() {
    const name = prompt("Enter New Project Address:");
    if (!name) return;
    const id = 'proj_' + Date.now();
    projects[id] = { 
      id: id, name: name, 
      contractors: JSON.parse(JSON.stringify(DEFAULT_CONTRACTORS)), 
      steps: JSON.parse(JSON.stringify(MASTER_TEMPLATE)),
      checklist: [] 
    };
    currentProjectId = id;
    setView('PROJECT');
    saveState();
    render();
  }

  function duplicateCurrentProject() {
    if (!currentProjectId || !projects[currentProjectId]) return alert("No active project to copy.");
    const name = prompt("Enter Address for the Copied Project:");
    if (!name) return;
    
    const original = projects[currentProjectId];
    const newId = 'proj_' + Date.now();
    
    const copiedSteps = original.steps.map(step => ({
      ...step,
      status: step.prereqs.length === 0 ? "READY TO START" : "LOCKED",
      notes: "", date: "", docLink: ""
    }));

    projects[newId] = {
      id: newId, name: name,
      contractors: JSON.parse(JSON.stringify(original.contractors)),
      steps: copiedSteps,
      checklist: []
    };
    
    currentProjectId = newId;
    setView('PROJECT');
    saveState();
    render();
  }

  function deleteCurrentProject() {
    if (!currentProjectId) return;
    if (confirm("Are you sure you want to delete this project permanently?")) {
      delete projects[currentProjectId];
      currentProjectId = Object.keys(projects)[0] || null;
      saveState();
      render();
    }
  }

  function switchProject(id) { currentProjectId = id; saveState(); render(); }

  function setView(viewMode) {
    currentView = viewMode;
    document.getElementById('view-project-btn').className = `view-btn ${viewMode === 'PROJECT' ? 'active' : ''}`;
    document.getElementById('view-day-btn').className = `view-btn ${viewMode === 'DAY' ? 'active' : ''}`;
    document.getElementById('project-controls').style.display = viewMode === 'PROJECT' ? 'flex' : 'none';
    render();
  }

  /* MODALS FOR JOBS & TRADES */
  function closeModals() {
    document.getElementById('modal-job').style.display = 'none';
    document.getElementById('modal-trade').style.display = 'none';
  }

  function openJobModal() {
    if (!currentProjectId) return alert("Create a project first!");
    const prereqSelect = document.getElementById('new-job-prereq');
    prereqSelect.innerHTML = '<option value="0">None (Start Immediately)</option>';
    projects[currentProjectId].steps.forEach(s => {
      prereqSelect.innerHTML += `<option value="${s.id}">Wait for: ${s.name}</option>`;
    });
    document.getElementById('new-job-name').value = '';
    document.getElementById('modal-job').style.display = 'flex';
  }

  function addJob() {
    const name = document.getElementById('new-job-name').value;
    const owner = document.getElementById('new-job-owner').value;
    const prereqId = parseInt(document.getElementById('new-job-prereq').value);
    
    if (!name) return alert("Please enter a job title");

    const project = projects[currentProjectId];
    const newId = project.steps.length > 0 ? Math.max(...project.steps.map(s => s.id)) + 1 : 1;
    const prereqs = prereqId === 0 ? [] : [prereqId];

    project.steps.push({ id: newId, name: name, owner: owner, prereqs: prereqs, status: "LOCKED", notes: "", date: "", docLink: "" });
    evaluateDependencies(project.steps);
    saveState();
    closeModals();
    render();
  }

  // --- NEW DELETE JOB LOGIC ---
  function removeJob(projectId, stepId) {
    if (confirm("Are you sure you want to delete this job?")) {
      const project = projects[projectId];
      // Remove step
      project.steps = project.steps.filter(s => s.id !== stepId);
      // Remove step from prerequisites of other steps so they don't get stuck locked
      project.steps.forEach(s => {
        s.prereqs = s.prereqs.filter(id => id !== stepId);
      });
      evaluateDependencies(project.steps);
      saveState();
      render();
    }
  }

  function openTradeModal() {
    if (!currentProjectId) return alert("Create a project first!");
    document.getElementById('new-trade-role').value = '';
    document.getElementById('new-trade-company').value = '';
    document.getElementById('new-trade-contact').value = '';
    document.getElementById('new-trade-email').value = '';
    document.getElementById('modal-trade').style.display = 'flex';
  }

  function addTrade() {
    const trade = document.getElementById('new-trade-role').value;
    if (!trade) return alert("Please enter a Trade / Role");

    projects[currentProjectId].contractors.push({
      trade: trade,
      company: document.getElementById('new-trade-company').value,
      contact: document.getElementById('new-trade-contact').value,
      email: document.getElementById('new-trade-email').value
    });
    
    saveState();
    closeModals();
    render();
  }

  function removeTrade(index) {
    if (confirm("Remove this trade?")) {
      projects[currentProjectId].contractors.splice(index, 1);
      saveState();
      render();
    }
  }

  function updateField(projectId, type, id, field, value) {
    const project = projects[projectId];
    if (!project) return;
    
    if (type === 'contractor') {
      project.contractors[id][field] = value;
      if (field === 'company' && value.trim()) rolodex.push(value.trim());
    } else if (type === 'step') {
      const step = project.steps.find(s => s.id === id);
      if (step) {
        step[field] = value;
        if (field === 'status') evaluateDependencies(project.steps);
      }
    }
    saveState();
    render();
  }

  /* CHECKLIST LOGIC */
  function addChecklistItem() {
    const input = document.getElementById('new-check-text');
    if(!input.value || !currentProjectId) return;
    projects[currentProjectId].checklist = projects[currentProjectId].checklist || [];
    projects[currentProjectId].checklist.push({ id: Date.now(), text: input.value, status: "PENDING" });
    input.value = '';
    saveState();
    render();
  }
  function updateChecklistStatus(projectId, id, status) {
    const item = projects[projectId].checklist.find(i => i.id === id);
    if(item) { item.status = status; saveState(); render(); }
  }
  function deleteChecklistItem(projectId, id) {
    projects[projectId].checklist = projects[projectId].checklist.filter(i => i.id !== id);
    saveState();
    render();
  }

  function evaluateDependencies(steps) {
    steps.forEach(step => {
      if (step.status === "COMPLETE") return;
      const prereqsMet = step.prereqs.every(reqId => steps.find(s => s.id === reqId)?.status === "COMPLETE");
      if (prereqsMet && step.status === "LOCKED") step.status = "READY TO START";
      else if (!prereqsMet && step.status !== "LOCKED") step.status = "LOCKED";
    });
  }

  function generateTileHTML(step, projectId, projectName = null) {
    let statusClass = "status-" + step.status.replace(/ /g, '-').toLowerCase().split('-')[0];
    let badgeClass = "bg-" + statusClass.split('-')[1];

    let smartButton = '';
    if (step.status === 'READY TO START') smartButton = `<button class="smart-btn btn-primary" onclick="updateField('${projectId}', 'step', ${step.id}, 'status', 'IN PROGRESS')">Start Work ▶</button>`;
    else if (step.status === 'IN PROGRESS') smartButton = `<button class="smart-btn btn-success" onclick="updateField('${projectId}', 'step', ${step.id}, 'status', 'COMPLETE')">Mark Complete ✓</button>`;
    else if (step.status === 'COMPLETE') smartButton = `<button class="smart-btn" style="background:#e2e8f0; color:#64748b;" onclick="updateField('${projectId}', 'step', ${step.id}, 'status', 'IN PROGRESS')">↺ Reopen Task</button>`;
    else smartButton = `<button class="smart-btn btn-locked" disabled>🔒 Locked</button>`;

    step.docLink = step.docLink || "";
    let projectTagHtml = projectName ? `<div class="project-tag">📍 ${projectName}</div>` : '';

    return `
      <div class="tile card ${statusClass}">
        ${projectTagHtml}
        <div class="tile-header">
          <span class="step-badge ${badgeClass}">
            ${step.status}
          </span>
          <div style="display:flex; gap:8px; align-items:center;">
            <span style="font-size:11px; font-weight:700; color:#94a3b8;">${step.owner}</span>
            <span class="del-btn-icon" onclick="removeJob('${projectId}', ${step.id})" title="Delete Job">×</span>
          </div>
        </div>
        <div class="tile-title">${step.name}</div>
        <div class="tile-meta">
          <input type="date" value="${step.date}" onchange="updateField('${projectId}', 'step', ${step.id}, 'date', this.value)">
        </div>
        <div class="doc-link-input">
          <input type="url" placeholder="Paste doc/invoice link..." value="${step.docLink}" onchange="updateField('${projectId}', 'step', ${step.id}, 'docLink', this.value)">
          ${step.docLink ? `<a href="${step.docLink}" target="_blank" class="doc-btn">📂 View</a>` : ''}
        </div>
        <textarea placeholder="Quick notes..." onchange="updateField('${projectId}', 'step', ${step.id}, 'notes', this.value)">${step.notes}</textarea>
        ${smartButton}
      </div>
    `;
  }

  function render() {
    updateRolodexDatalist();
    const selector = document.getElementById("project-selector");
    const sidebar = document.getElementById("sidebar-content");
    const content = document.getElementById("portal-content");

    selector.innerHTML = "";
    Object.keys(projects).forEach(id => {
      const opt = document.createElement("option");
      opt.value = id; opt.innerText = projects[id].name;
      if (id === currentProjectId) opt.selected = true;
      selector.appendChild(opt);
    });

    if (Object.keys(projects).length === 0) {
      content.innerHTML = `<div class="empty-state">No Active Projects. Click + New Project to begin.</div>`;
      sidebar.style.display = "none";
      return;
    }

    if (currentView === 'DAY') {
      sidebar.style.display = "flex";
      
      let sideHtml = `<div style="font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; color: var(--text-muted);">📋 Global Minor Tasks</div>`;
      let pendingCount = 0;
      Object.values(projects).forEach(project => {
        const pending = (project.checklist || []).filter(i => i.status === 'PENDING');
        if(pending.length > 0) {
          sideHtml += `<div style="font-size: 11px; font-weight: 700; color: var(--color-progress); margin-top: 12px; margin-bottom: 4px;">📍 ${project.name}</div>`;
          pending.forEach(item => {
            pendingCount++;
            sideHtml += `
              <div class="check-item">
                <input type="checkbox" onchange="updateChecklistStatus('${project.id}', ${item.id}, 'COMPLETED')">
                <div class="check-text">${item.text}</div>
              </div>
            `;
          });
        }
      });
      if(pendingCount === 0) sideHtml += `<div style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">All minor tasks are clear!</div>`;
      sidebar.innerHTML = sideHtml;

      let html = `<div class="section-title" style="margin-top:0;">☀️ Today's Active Tasks</div><div class="grid">`;
      let activeTaskCount = 0;
      Object.values(projects).forEach(project => {
        evaluateDependencies(project.steps);
        project.steps.forEach(step => {
          if (step.status === 'READY TO START' || step.status === 'IN PROGRESS') {
            html += generateTileHTML(step, project.id, project.name);
            activeTaskCount++;
          }
        });
      });
      if (activeTaskCount === 0) html += `<div class="empty-state" style="grid-column: 1/-1;">You're all caught up! No active tasks for today.</div>`;
      html += `</div>`;
      content.innerHTML = html;
      return;
    }

    if (!currentProjectId || !projects[currentProjectId]) return;
    const project = projects[currentProjectId];
    evaluateDependencies(project.steps);

    sidebar.style.display = "flex";
    let sideHtml = `
      <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px;">📋 Minor Tasks</div>
      <input type="text" id="new-check-text" placeholder="Add task & press Enter..." onkeypress="if(event.key==='Enter') addChecklistItem()" style="padding: 8px; font-size: 12px; margin-bottom: 10px;">
      <div style="display: flex; flex-direction: column;">
    `;
    (project.checklist || []).forEach(item => {
      const isDone = item.status === 'COMPLETED';
      sideHtml += `
        <div class="check-item" style="${isDone ? 'opacity: 0.5;' : ''}">
           <input type="checkbox" ${isDone ? 'checked' : ''} onchange="updateChecklistStatus('${project.id}', ${item.id}, this.checked ? 'COMPLETED' : 'PENDING')">
           <div class="check-text" style="${isDone ? 'text-decoration: line-through;' : ''}">${item.text}</div>
           <button class="chk-del" onclick="deleteChecklistItem('${project.id}', ${item.id})">×</button>
        </div>
      `;
    });
    sideHtml += `</div>`;
    sidebar.innerHTML = sideHtml;

    let html = `
      <div class="section-title" style="margin-top: 0;">
        PROJECT DIRECTORY
        <button class="btn-add-small" onclick="openTradeModal()">+ Add Trade</button>
      </div>
      <div class="contractors-grid">`;
    project.contractors.forEach((c, i) => {
      html += `
        <div class="card contractor-card">
          <div class="trade-title">
            ${c.trade}
            <span class="del-btn-icon" onclick="removeTrade(${i})" title="Remove Trade">×</span>
          </div>
          <input type="text" list="rolodex-companies" placeholder="Company Name" value="${c.company}" onchange="updateField('${project.id}', 'contractor', ${i}, 'company', this.value)">
          <div style="display: flex; gap: 5px;">
            <input type="text" placeholder="Contact" value="${c.contact}" onchange="updateField('${project.id}', 'contractor', ${i}, 'contact', this.value)">
            <input type="email" placeholder="Email" value="${c.email}" onchange="updateField('${project.id}', 'contractor', ${i}, 'email', this.value)">
          </div>
        </div>
      `;
    });
    html += `</div>
      <div class="section-title">
        WORKFLOW TILES
        <button class="btn-add-small" onclick="openJobModal()">+ Add Job</button>
      </div>
      <div class="grid">`;
    project.steps.forEach(step => { html += generateTileHTML(step, project.id); });
    html += `</div>`;
    content.innerHTML = html;
  }

  updateRolodexDatalist();
  render();
</script>
</body>
</html>
