<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARNEL HOMES - Site Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* MODERN, HIGH-CONTRAST SAAS PALETTE */
  :root {
    --nav-bg: #0f172a;        /* Deep Slate for Sidebar */
    --nav-text: #94a3b8;
    --nav-active: #ffffff;
    --nav-hover: #1e293b;
    
    --bg-page: #f8fafc;       /* Light gray workspace */
    --bg-card: #ffffff;
    
    --text-main: #0f172a;
    --text-muted: #64748b;
    
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    
    --border-soft: #e2e8f0;
    
    --color-locked-bg: #f1f5f9;
    --color-ready: #f59e0b;
    --color-progress: #3b82f6;
    --color-complete: #10b981;

    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  
  /* App Shell */
  body { background: var(--bg-page); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  .app-layout { display: flex; flex: 1; overflow: hidden; }
  
  /* LEFT SIDEBAR (Dark Navigation) */
  .left-sidebar { width: 260px; background: var(--nav-bg); color: var(--nav-text); display: flex; flex-direction: column; border-right: 1px solid #1e293b; z-index: 10; }
  .sidebar-header { padding: 24px 20px; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; border-bottom: 1px solid #1e293b; }
  .sidebar-section { padding: 20px; flex: 1; overflow-y: auto; }
  .sidebar-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: #64748b; display: flex; justify-content: space-between; align-items: center;}
  
  .nav-item { padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; color: var(--nav-text); }
  .nav-item:hover { background: var(--nav-hover); color: var(--nav-active); }
  .nav-item.active { background: var(--primary); color: #fff; }
  
  .project-item { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .project-item:hover { background: var(--nav-hover); color: var(--nav-active); }
  .project-item.active { background: #1e293b; color: #fff; border-left: 3px solid var(--primary); }

  /* CENTER WORKSPACE */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-page); }
  .workspace-header { background: #fff; padding: 24px 32px; border-bottom: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 16px; }
  .header-top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .project-title-group { display: flex; align-items: center; gap: 12px; }
  .workspace-title { font-size: 24px; font-weight: 800; color: var(--text-main); }
  .btn-icon { background: #f1f5f9; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: 0.2s; }
  .btn-icon:hover { background: #e2e8f0; color: var(--text-main); }
  
  .workspace-actions { display: flex; gap: 8px; }
  .workspace-scroll { flex: 1; overflow-y: auto; padding: 32px; }

  /* RIGHT SIDEBAR (Context Panel) */
  .right-sidebar { width: 300px; background: #fff; border-left: 1px solid var(--border-soft); display: flex; flex-direction: column; overflow-y: auto; }
  .right-panel-section { padding: 24px; border-bottom: 1px solid var(--border-soft); }

  /* UI Elements */
  input, select, textarea { font-size: 13px; padding: 10px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; outline: none; width: 100%; transition: 0.2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
  
  button { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: var(--text-main); }
  .btn-outline:hover { background: #f1f5f9; }
  .btn-danger-outline { background: transparent; color: #ef4444; }
  .btn-danger-outline:hover { background: #fee2e2; }

  .card { background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); padding: 20px; }
  
  /* Collapsible Sections */
  details > summary { list-style: none; cursor: pointer; user-select: none; }
  details > summary::-webkit-details-marker { display: none; }
  .chevron { display: inline-block; transition: transform 0.2s; font-size: 10px; color: var(--text-muted); }
  details:not([open]) .chevron { transform: rotate(-90deg); }
  
  .section-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
  
  /* Progress Bar */
  .progress-wrapper { width: 100%; background: #f1f5f9; border-radius: 999px; height: 8px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--color-complete); transition: width 0.5s ease; }
  .progress-text { font-size: 12px; font-weight: 700; color: var(--text-muted); }

  /* Workflow Tiles (Clearer Hierarchy) */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
  .tile { display: flex; flex-direction: column; gap: 12px; position: relative; transition: 0.2s; cursor: grab; background: #fff; border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); padding: 16px; }
  
  /* Tile States - Making them instantly recognizable */
  .tile.status-locked { background: var(--color-locked-bg); opacity: 0.6; border: 1px dashed #cbd5e1; box-shadow: none; }
  .tile.status-ready { border: 2px solid var(--color-ready); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15); }
  .tile.status-in { border: 2px solid var(--color-progress); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); }
  .tile.status-complete { border: 1px solid #a7f3d0; background: #f0fdf4; }

  .tile-header { display: flex; justify-content: space-between; align-items: center; }
  .step-badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
  .bg-locked { background: #e2e8f0; color: #64748b; }
  .bg-ready { background: #fef3c7; color: #b45309; }
  .bg-progress { background: #dbeafe; color: #1d4ed8; }
  .bg-complete { background: #d1fae5; color: #047857; }

  .tile-title { font-size: 15px; font-weight: 700; line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; }
  .drag-handle { color: #cbd5e1; cursor: grab; font-size: 16px; transition: 0.2s; }
  
  .tile-meta { display: flex; gap: 8px; }
  .doc-link-input { display: flex; gap: 8px; }
  .doc-btn { background: #f1f5f9; color: var(--text-main); padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; transition: 0.2s; }
  .doc-btn:hover { background: #e2e8f0; }
  .tile textarea { height: 60px; resize: none; }
  
  .smart-btn { width: 100%; padding: 12px; margin-top: auto; font-size: 13px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
  .btn-locked { background: transparent; color: var(--text-muted); cursor: not-allowed; border: 1px dashed #cbd5e1; }
  .btn-success { background: var(--color-complete); color: #fff; }

  /* Contractors & Checklists */
  .contractors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 16px; margin-top: 16px; }
  .trade-title { font-weight: 800; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  
  .check-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; gap: 12px; }
  .check-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }
  .check-text { font-size: 13px; flex: 1; }
  .chk-del { color: #ef4444; font-weight: bold; cursor: pointer; border: none; background: transparent; padding: 4px; opacity: 0; transition: 0.2s; }
  .check-item:hover .chk-del { opacity: 1; }

  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .cal-header-day { font-weight: 700; text-align: center; font-size: 12px; color: var(--text-muted); text-transform: uppercase; padding-bottom: 8px; }
  .cal-cell { min-height: 110px; border-radius: 12px; padding: 10px; cursor: pointer; background: #fff; border: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 6px; transition: 0.2s; }
  .cal-cell:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .cal-date-num { font-size: 14px; font-weight: 800; }
  .cal-event { font-size: 11px; background: #e0e7ff; color: var(--primary); padding: 6px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-event.completed { text-decoration: line-through; opacity: 0.6; background: #f1f5f9; color: var(--text-muted); }

  /* Empty States */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; background: #fff; border-radius: 12px; border: 1px dashed #cbd5e1; margin-top: 20px; }

  /* Modals */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; }
  .modal-content { background: #fff; width: 100%; max-width: 420px; padding: 32px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
  .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }

  @media (max-width: 900px) {
    .app-layout { flex-direction: column; overflow: auto; }
    .left-sidebar { width: 100%; height: auto; flex: none; border-right: none; border-bottom: 1px solid #1e293b; }
    .right-sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border-soft); }
    .workspace-scroll { padding: 16px; }
  }
</style>
</head>
<body>

<datalist id="rolodex-companies"></datalist>

<!-- Modals -->
<div class="modal-overlay" id="modal-project">
  <div class="modal-content">
    <div class="modal-title" id="modal-project-title">Add New Project</div>
    <input type="text" id="project-address-input" placeholder="Enter Project Address (e.g. 12 Smith St)">
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="submitProjectModal()">Save Project</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-job">
  <div class="modal-content">
    <div class="modal-title">Add Custom Job Tile</div>
    <input type="text" id="new-job-name" placeholder="Job Title (e.g. Pool Excavation)">
    <select id="new-job-owner">
      <option value="Site">Owner: Site</option>
      <option value="Office">Owner: Office</option>
    </select>
    <div style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 4px;">Activate After:</div>
    <select id="new-job-prereq"></select>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="addJob()">Add Job</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-trade">
  <div class="modal-content">
    <div class="modal-title">Add New Trade</div>
    <input type="text" id="new-trade-role" placeholder="Trade / Role (e.g. Concreter)">
    <input type="text" id="new-trade-company" placeholder="Company Name">
    <input type="text" id="new-trade-contact" placeholder="Contact Name">
    <input type="email" id="new-trade-email" placeholder="Email Address">
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="addTrade()">Add Trade</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-event">
  <div class="modal-content">
    <div class="modal-title">Add Booking / Meeting</div>
    <div style="font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: -5px;" id="event-modal-project-name"></div>
    <input type="date" id="event-date">
    <input type="text" id="event-text" placeholder="e.g. Certifier Inspection...">
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="addCalendarEvent()">Save Booking</button>
    </div>
  </div>
</div>

<!-- Main App Shell -->
<div class="app-layout">
  
  <!-- LEFT NAV MENU -->
  <aside class="left-sidebar">
    <div class="sidebar-header">KARNEL HOMES</div>
    
    <div class="sidebar-section" style="border-bottom: 1px solid #1e293b; padding-bottom: 20px; flex: none;">
      <div class="sidebar-title">Main Views</div>
      <div class="nav-item active" id="nav-project" onclick="setView('PROJECT')">🏢 Project Board</div>
      <div class="nav-item" id="nav-day" onclick="setView('DAY')">☀️ My Day</div>
      <div class="nav-item" id="nav-calendar" onclick="setView('CALENDAR')">📅 Calendar</div>
    </div>

    <div class="sidebar-section" style="display: flex; flex-direction: column;">
      <div class="sidebar-title">
        Active Projects
        <button style="background: transparent; border: none; color: var(--primary); cursor: pointer; font-size: 16px; padding: 0;" onclick="openProjectModal('NEW')" title="New Project">＋</button>
      </div>
      <div id="project-list-container" style="flex: 1; overflow-y: auto;">
        <!-- Project list renders here -->
      </div>
    </div>
  </aside>

  <!-- CENTER WORKSPACE -->
  <main class="main-content">
    <header class="workspace-header" id="workspace-header">
      <!-- Dynamic header renders here based on view -->
    </header>
    
    <div class="workspace-scroll" id="portal-content">
      <!-- Dynamic content renders here -->
    </div>
  </main>

  <!-- RIGHT CONTEXT PANEL -->
  <aside class="right-sidebar" id="right-sidebar-content">
      <!-- Details and checklists render here -->
  </aside>
</div>

<script>
  // ==========================================
  // 1. SUPABASE CONNECTION DETAILS
  // ==========================================
  const SUPABASE_URL = 'https://giovxsxgkdilawyxuiqb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_k9sU8tyILCmQTxAI36ufWQ__JsPNSRY';
  
  let supabaseClient = null;

  try {
    if (SUPABASE_URL.startsWith('http')) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch(e) { console.error("Supabase error:", e); }

  // ==========================================
  // 2. STATE & DEFAULT TEMPLATES
  // ==========================================
  const DEFAULT_CONTRACTORS = [
    { trade: "Certifier", company: "", contact: "", email: "" },
    { trade: "Architect", company: "", contact: "", email: "" },
    { trade: "Plumber", company: "", contact: "", email: "" },
    { trade: "Electrician", company: "", contact: "", email: "" }
  ];

  const MASTER_TEMPLATE = [
    { id: 1, name: "CC / CDC Approval Received", owner: "Office", prereqs: [], status: "READY TO START", notes: "", date: "" }
  ];

  let projects = JSON.parse(localStorage.getItem('karnel_data_final10')) || {};
  let currentProjectId = localStorage.getItem('karnel_active_final10') || null;
  let rolodex = JSON.parse(localStorage.getItem('karnel_rolodex')) || [];
  let currentView = 'PROJECT'; 
  let draggedStepId = null;
  let projectModalMode = 'NEW';
  let calMonth = new Date().getMonth();
  let calYear = new Date().getFullYear();

  // ==========================================
  // 3. CLOUD SYNC & LOCAL STORAGE LOGIC
  // ==========================================
  function saveState() {
    localStorage.setItem('karnel_data_final10', JSON.stringify(projects));
    localStorage.setItem('karnel_active_final10', currentProjectId);
    localStorage.setItem('karnel_rolodex', JSON.stringify([...new Set(rolodex)])); 
    updateRolodexDatalist();
    syncToSupabase();
  }

  async function syncToSupabase() {
    if (!supabaseClient || !currentProjectId || !projects[currentProjectId]) return;
    try {
      await supabaseClient.from('karnel_projects').upsert({ id: currentProjectId, name: projects[currentProjectId].name, data: projects[currentProjectId] });
    } catch (e) {}
  }

  async function loadFromCloud() {
    if (!supabaseClient) return;
    try {
      const { data } = await supabaseClient.from('karnel_projects').select('*');
      if (data && data.length > 0) {
        data.forEach(row => { projects[row.id] = row.data; });
        updateRolodexDatalist();
        if (!currentProjectId || !projects[currentProjectId]) currentProjectId = data[0].id;
        render();
      }
      supabaseClient.channel('karnel-live').on('postgres_changes', { event: '*', schema: 'public', table: 'karnel_projects' }, payload => {
          projects[payload.new.id] = payload.new.data;
          if (payload.new.id === currentProjectId || currentView === 'DAY' || currentView === 'CALENDAR') render();
      }).subscribe();
    } catch (e) {}
  }

  // ==========================================
  // 4. CORE APP FUNCTIONS
  // ==========================================
  function updateRolodexDatalist() {
    const list = document.getElementById('rolodex-companies');
    list.innerHTML = '';
    rolodex.forEach(company => { if(company.trim()) list.innerHTML += `<option value="${company}">`; });
  }

  function exportBackupData() {
    const backupData = { timestamp: new Date().toISOString(), projects: projects, rolodex: rolodex };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `Karnel_Homes_Backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(dlAnchorElem);
    dlAnchorElem.click();
    dlAnchorElem.remove();
  }

  function editProjectName() {
    if (!currentProjectId || !projects[currentProjectId]) return;
    const currentName = projects[currentProjectId].name;
    const newName = prompt("Edit Project Address:", currentName);
    if (newName && newName.trim() !== "") {
      projects[currentProjectId].name = newName.trim();
      saveState();
      render();
    }
  }

  /* PROJECT MODALS */
  function openProjectModal(mode) {
    if (mode === 'COPY' && (!currentProjectId || !projects[currentProjectId])) return alert("No active project to copy.");
    projectModalMode = mode;
    document.getElementById('modal-project-title').innerText = mode === 'NEW' ? 'Create New Project' : 'Copy Current Project';
    document.getElementById('project-address-input').value = '';
    document.getElementById('modal-project').style.display = 'flex';
    document.getElementById('project-address-input').focus();
  }

  function submitProjectModal() {
    const name = document.getElementById('project-address-input').value.trim();
    if (!name) return alert("Please enter an address.");
    
    if (projectModalMode === 'NEW') {
      const id = 'proj_' + Date.now();
      projects[id] = { id: id, name: name, contractors: JSON.parse(JSON.stringify(DEFAULT_CONTRACTORS)), steps: JSON.parse(JSON.stringify(MASTER_TEMPLATE)), checklist: [], events: [], projectLocationLink: "" };
      currentProjectId = id;
    } else if (projectModalMode === 'COPY') {
      const original = projects[currentProjectId];
      const newId = 'proj_' + Date.now();
      const copiedSteps = original.steps.map(step => ({ ...step, status: step.prereqs.length === 0 ? "READY TO START" : "LOCKED", notes: "", date: "", docLink: "" }));
      projects[newId] = { id: newId, name: name, contractors: JSON.parse(JSON.stringify(original.contractors)), steps: copiedSteps, checklist: [], events: [], projectLocationLink: "" };
      currentProjectId = newId;
    }
    setView('PROJECT');
    saveState();
    closeModals();
    render();
  }

  function deleteCurrentProject() {
    if (!currentProjectId) return;
    if (confirm("Are you sure you want to delete this project permanently?")) {
      if(supabaseClient) supabaseClient.from('karnel_projects').delete().eq('id', currentProjectId).then();
      delete projects[currentProjectId];
      currentProjectId = Object.keys(projects)[0] || null;
      saveState();
      render();
    }
  }

  function switchProject(id) { currentProjectId = id; currentView = 'PROJECT'; saveState(); render(); }
  
  function setView(viewMode) {
    currentView = viewMode;
    document.getElementById('nav-project').className = `nav-item ${viewMode === 'PROJECT' ? 'active' : ''}`;
    document.getElementById('nav-day').className = `nav-item ${viewMode === 'DAY' ? 'active' : ''}`;
    document.getElementById('nav-calendar').className = `nav-item ${viewMode === 'CALENDAR' ? 'active' : ''}`;
    render();
  }

  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none');
  }

  /* JOBS & TRADES */
  function openJobModal() {
    if (!currentProjectId) return alert("Create a project first!");
    const prereqSelect = document.getElementById('new-job-prereq');
    prereqSelect.innerHTML = '<option value="0">None (Start Immediately)</option>';
    projects[currentProjectId].steps.forEach(s => { prereqSelect.innerHTML += `<option value="${s.id}">Wait for: ${s.name}</option>`; });
    document.getElementById('new-job-name').value = '';
    document.getElementById('modal-job').style.display = 'flex';
  }

  function addJob() {
    const name = document.getElementById('new-job-name').value;
    const owner = document.getElementById('new-job-owner').value;
    const prereqId = parseInt(document.getElementById('new-job-prereq').value);
    if (!name) return alert("Please enter a job title");
    const project = projects[currentProjectId];
    const newId = project.steps.length > 0 ? Math.max(...project.steps.map(s => s.id)) + 1 : 1;
    const prereqs = prereqId === 0 ? [] : [prereqId];
    project.steps.push({ id: newId, name: name, owner: owner, prereqs: prereqs, status: "LOCKED", notes: "", date: "" });
    evaluateDependencies(project.steps);
    saveState();
    closeModals();
    render();
  }

  function removeJob(projectId, stepId) {
    if (confirm("Are you sure you want to delete this job?")) {
      const project = projects[projectId];
      project.steps = project.steps.filter(s => s.id !== stepId);
      project.steps.forEach(s => { s.prereqs = s.prereqs.filter(id => id !== stepId); });
      evaluateDependencies(project.steps);
      saveState();
      render();
    }
  }

  function openTradeModal() {
    if (!currentProjectId) return alert("Create a project first!");
    document.getElementById('modal-trade').style.display = 'flex';
  }

  function addTrade() {
    const trade = document.getElementById('new-trade-role').value;
    if (!trade) return alert("Please enter a Trade / Role");
    projects[currentProjectId].contractors.push({ trade: trade, company: document.getElementById('new-trade-company').value, contact: document.getElementById('new-trade-contact').value, email: document.getElementById('new-trade-email').value });
    saveState();
    closeModals();
    render();
  }

  function removeTrade(index) {
    if (confirm("Remove this trade?")) {
      projects[currentProjectId].contractors.splice(index, 1);
      saveState();
      render();
    }
  }

  function updateField(projectId, type, id, field, value) {
    const project = projects[projectId];
    if (!project) return;
    if (type === 'contractor') {
      project.contractors[id][field] = value;
      if (field === 'company' && value.trim()) rolodex.push(value.trim());
    } else if (type === 'step') {
      const step = project.steps.find(s => s.id === id);
      if (step) {
        step[field] = value;
        if (field === 'status') evaluateDependencies(project.steps);
      }
    } else if (type === 'locationLink') {
      project.projectLocationLink = value;
    }
    saveState();
    render(); 
  }

  /* DRAG AND DROP */
  function dragStart(event, stepId) { draggedStepId = stepId; event.dataTransfer.effectAllowed = 'move'; }
  function dragOver(event, el) { event.preventDefault(); el.classList.add('drag-over'); }
  function dragLeave(event, el) { el.classList.remove('drag-over'); }
  function drop(event, targetId, el) {
    event.preventDefault();
    el.classList.remove('drag-over');
    if (draggedStepId === targetId) return;
    const project = projects[currentProjectId];
    const fromIndex = project.steps.findIndex(s => s.id === draggedStepId);
    const toIndex = project.steps.findIndex(s => s.id === targetId);
    const movedStep = project.steps.splice(fromIndex, 1)[0];
    project.steps.splice(toIndex, 0, movedStep);
    saveState();
    render();
  }

  /* CHECKLIST */
  function addChecklistItem() {
    const input = document.getElementById('new-check-text');
    if(!input.value || !currentProjectId) return;
    projects[currentProjectId].checklist = projects[currentProjectId].checklist || [];
    projects[currentProjectId].checklist.push({ id: Date.now(), text: input.value, status: "PENDING" });
    input.value = '';
    saveState();
    render();
  }
  function updateChecklistStatus(projectId, id, status) {
    const item = projects[projectId].checklist.find(i => i.id === id);
    if(item) { item.status = status; saveState(); render(); }
  }
  function deleteChecklistItem(projectId, id) {
    projects[projectId].checklist = projects[projectId].checklist.filter(i => i.id !== id);
    saveState();
    render();
  }

  /* CALENDAR LOGIC */
  function changeMonth(direction) { calMonth += direction; if (calMonth < 0) { calMonth = 11; calYear--; } if (calMonth > 11) { calMonth = 0; calYear++; } render(); }
  function openCalendarModal(dateStr) {
    if (!currentProjectId || !projects[currentProjectId]) return alert("Please select an active project from the left menu first.");
    document.getElementById('event-modal-project-name').innerText = "📍 " + projects[currentProjectId].name;
    document.getElementById('event-date').value = dateStr;
    document.getElementById('event-text').value = '';
    document.getElementById('modal-event').style.display = 'flex';
    setTimeout(() => document.getElementById('event-text').focus(), 100);
  }
  function addCalendarEvent() {
    const text = document.getElementById('event-text').value.trim();
    const date = document.getElementById('event-date').value;
    if (!text || !date) return alert("Please enter both a date and a description.");
    const project = projects[currentProjectId];
    project.events = project.events || [];
    project.events.push({ id: Date.now(), date: date, text: text, status: "PENDING" });
    saveState();
    closeModals();
    render();
  }
  function toggleEventStatus(projectId, eventId) {
    const ev = projects[projectId].events.find(e => e.id === eventId);
    if (ev) { ev.status = ev.status === 'COMPLETED' ? 'PENDING' : 'COMPLETED'; saveState(); render(); }
  }

  function evaluateDependencies(steps) {
    steps.forEach(step => {
      if (step.status === "COMPLETE") return;
      const prereqsMet = step.prereqs.every(reqId => steps.find(s => s.id === reqId)?.status === "COMPLETE");
      if (prereqsMet && step.status === "LOCKED") step.status = "READY TO START";
      else if (!prereqsMet && step.status !== "LOCKED") step.status = "LOCKED";
    });
  }

  function generateTileHTML(step, projectId, projectName = null) {
    let statusClass = "status-" + step.status.replace(/ /g, '-').toLowerCase().split('-')[0];
    let badgeClass = "bg-" + statusClass.split('-')[1];

    let smartButton = '';
    if (step.status === 'READY TO START') smartButton = `<button class="smart-btn btn-primary" onclick="updateField('${projectId}', 'step', ${step.id}, 'status', 'IN PROGRESS')">Start Work ▶</button>`;
    else if (step.status === 'IN PROGRESS') smartButton = `<button class="smart-btn btn-success" onclick="updateField('${projectId}', 'step', ${step.id}, 'status', 'COMPLETE')">Mark Complete ✓</button>`;
    else if (step.status === 'COMPLETE') smartButton = `<button class="smart-btn" style="background:#f1f5f9; color:#64748b;" onclick="updateField('${projectId}', 'step', ${step.id}, 'status', 'IN PROGRESS')">↺ Reopen Task</button>`;
    else smartButton = `<button class="smart-btn btn-locked" disabled>🔒 Locked</button>`;

    let projectTagHtml = projectName ? `<div class="project-tag">📍 ${projectName}</div>` : '';

    return `
      <div class="tile ${statusClass}" draggable="true" ondragstart="dragStart(event, ${step.id})" ondragover="dragOver(event, this)" ondragleave="dragLeave(event, this)" ondrop="drop(event, ${step.id}, this)">
        ${projectTagHtml}
        <div class="tile-header">
          <span class="step-badge ${badgeClass}">${step.status}</span>
          <div style="display:flex; gap:8px; align-items:center;">
            <span style="font-size:11px; font-weight:700; color:var(--text-muted);">${step.owner}</span>
            <span class="chk-del" style="opacity:1;" onclick="removeJob('${projectId}', ${step.id})" title="Delete Job">×</span>
          </div>
        </div>
        <div class="tile-title"><span class="drag-handle" title="Drag to reorder">⋮⋮</span> ${step.name}</div>
        <div class="tile-meta"><input type="date" value="${step.date}" onchange="updateField('${projectId}', 'step', ${step.id}, 'date', this.value)"></div>
        <div class="doc-link-input">
          <input type="url" placeholder="Paste doc/invoice link..." value="${step.docLink || ''}" onchange="updateField('${projectId}', 'step', ${step.id}, 'docLink', this.value)">
          ${step.docLink ? `<a href="${step.docLink}" target="_blank" class="doc-btn">📂 View</a>` : ''}
        </div>
        <textarea placeholder="Quick notes..." onchange="updateField('${projectId}', 'step', ${step.id}, 'notes', this.value)">${step.notes}</textarea>
        ${smartButton}
      </div>
    `;
  }

  function render() {
    const listContainer = document.getElementById("project-list-container");
    const workspaceHeader = document.getElementById("workspace-header");
    const content = document.getElementById("portal-content");
    const rightSidebar = document.getElementById("right-sidebar-content");

    // --- LEFT SIDEBAR (Projects) ---
    let listHtml = '';
    if (Object.keys(projects).length === 0) {
      listHtml = `<div style="font-size:13px; color:var(--nav-text); padding: 0 14px;">No active projects.</div>`;
    } else {
      Object.values(projects).forEach(p => {
        const isActive = p.id === currentProjectId && currentView !== 'DAY' && currentView !== 'CALENDAR';
        listHtml += `<div class="project-item ${isActive ? 'active' : ''}" onclick="switchProject('${p.id}')">${p.name}</div>`;
      });
    }
    listContainer.innerHTML = listHtml;

    if (Object.keys(projects).length === 0) {
      workspaceHeader.innerHTML = `<div class="workspace-title">Welcome to Karnel Homes</div>`;
      content.innerHTML = `<div class="empty-state">No Active Projects.<br><br>Click the <b>+ New Project</b> button on the left menu to begin.</div>`;
      rightSidebar.style.display = "none";
      return;
    }

    // --- RENDER CALENDAR VIEW ---
    if (currentView === 'CALENDAR') {
      rightSidebar.style.display = "none";
      workspaceHeader.innerHTML = `
        <div class="header-top-row">
          <div class="workspace-title">📅 Global Calendar</div>
        </div>
      `;
      
      const firstDay = new Date(calYear, calMonth, 1).getDay(); 
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const today = new Date();
      const monthName = new Date(calYear, calMonth).toLocaleString('default', { month: 'long' });

      let calHtml = `
        <div class="card" style="padding: 32px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
            <button class="btn-outline" onclick="changeMonth(-1)">◀ Previous</button>
            <div style="font-size: 20px; font-weight: 800; text-transform: uppercase; color: var(--primary);">${monthName} ${calYear}</div>
            <button class="btn-outline" onclick="changeMonth(1)">Next ▶</button>
          </div>
          <div class="cal-grid">
      `;
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      days.forEach(d => { calHtml += `<div class="cal-header-day">${d}</div>`; });
      for (let i = 0; i < firstDay; i++) { calHtml += `<div></div>`; }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = (day === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
        let bgStyle = isToday ? 'background: #f0f9ff; border: 2px solid var(--primary);' : '';
        
        let dayEvents = '';
        Object.values(projects).forEach(project => {
          (project.events || []).forEach(ev => {
            if (ev.date === dateStr) {
              const statusClass = ev.status === 'COMPLETED' ? 'completed' : '';
              dayEvents += `<div class="cal-event ${statusClass}" title="${project.name} - ${ev.text}" onclick="event.stopPropagation(); toggleEventStatus('${project.id}', ${ev.id})"><strong>${project.name.substring(0,6)}..</strong>: ${ev.text}</div>`;
            }
          });
        });
        calHtml += `<div class="cal-cell" style="${bgStyle}" onclick="openCalendarModal('${dateStr}')"><div class="cal-date-num">${day}</div><div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">${dayEvents}</div></div>`;
      }
      calHtml += `</div></div>`;
      content.innerHTML = calHtml;
      return;
    }

    // --- RENDER MY DAY VIEW ---
    if (currentView === 'DAY') {
      workspaceHeader.innerHTML = `
        <div class="header-top-row">
          <div class="workspace-title">☀️ My Day Overview</div>
        </div>
      `;
      rightSidebar.style.display = "flex";
      
      let sideHtml = `<div class="right-panel-section"><div class="section-title">📋 Global Minor Tasks</div>`;
      let pendingCount = 0;
      Object.values(projects).forEach(project => {
        const pending = (project.checklist || []).filter(i => i.status === 'PENDING');
        if(pending.length > 0) {
          sideHtml += `<div style="font-size: 11px; font-weight: 700; color: var(--primary); margin-top: 16px; margin-bottom: 8px; background: #e0e7ff; padding: 4px 8px; border-radius: 6px; display: inline-block;">📍 ${project.name}</div>`;
          pending.forEach(item => {
            pendingCount++;
            sideHtml += `
              <div class="check-item">
                <input type="checkbox" onchange="updateChecklistStatus('${project.id}', ${item.id}, 'COMPLETED')">
                <div class="check-text">${item.text}</div>
              </div>
            `;
          });
        }
      });
      if(pendingCount === 0) sideHtml += `<div style="font-size: 13px; color: var(--text-muted); margin-top: 10px;">All minor tasks are clear!</div>`;
      sideHtml += `</div>`;
      rightSidebar.innerHTML = sideHtml;

      let eventHtml = `<div class="section-title" style="margin-top:0;">📅 Priority Bookings (Due within 48 Hrs)</div><div style="display:flex; flex-direction:column; gap:16px; margin-bottom: 32px;">`;
      let eventCount = 0;
      const today = new Date(); today.setHours(0,0,0,0);
      const targetDate = new Date(today); targetDate.setDate(today.getDate() + 2);

      Object.values(projects).forEach(project => {
        (project.events || []).forEach(ev => {
          if (ev.status === 'COMPLETED') return; 
          const parts = ev.date.split('-');
          const evDate = new Date(parts[0], parts[1]-1, parts[2]); evDate.setHours(0,0,0,0);
          if (evDate <= targetDate) {
            eventCount++;
            const dateString = evDate.toLocaleDateString('en-AU', { weekday: 'short', month: 'short', day: 'numeric' });
            eventHtml += `
              <div class="card" style="padding:16px; display:flex; align-items:flex-start; gap:16px; border-left: 4px solid var(--color-ready);">
                <input type="checkbox" onchange="toggleEventStatus('${project.id}', ${ev.id})" style="width:20px; height:20px; flex-shrink:0; margin-top:2px;">
                <div style="flex:1;">
                  <div style="font-size:15px; font-weight:700;">${ev.text}</div>
                  <div style="font-size:12px; color:var(--text-muted); margin-top:6px; display:flex; align-items:center; gap:8px;">
                    <span style="background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 999px; font-weight:700;">🗓️ ${dateString}</span> 
                    📍 <span style="color:var(--primary); font-weight:700;">${project.name}</span>
                  </div>
                </div>
              </div>`;
          }
        });
      });
      if (eventCount === 0) eventHtml += `<div style="font-size: 14px; color: var(--text-muted);">No upcoming priority bookings.</div>`;
      eventHtml += `</div>`;

      let html = eventHtml + `<div class="section-title" style="margin-top:0;">☀️ Today's Active Tasks</div><div class="grid">`;
      let activeTaskCount = 0;
      Object.values(projects).forEach(project => {
        evaluateDependencies(project.steps);
        project.steps.forEach(step => {
          if (step.status === 'READY TO START' || step.status === 'IN PROGRESS') {
            html += generateTileHTML(step, project.id, project.name);
            activeTaskCount++;
          }
        });
      });
      if (activeTaskCount === 0) html += `<div class="empty-state" style="grid-column: 1/-1;">You're all caught up! No active workflow tiles for today.</div>`;
      html += `</div>`;
      content.innerHTML = html;
      return;
    }

    // --- RENDER PROJECT VIEW (Workspace) ---
    if (!currentProjectId || !projects[currentProjectId]) return;
    const project = projects[currentProjectId];
    evaluateDependencies(project.steps);

    const totalSteps = project.steps.length;
    const completedSteps = project.steps.filter(s => s.status === 'COMPLETE').length;
    const progressPercent = totalSteps === 0 ? 0 : Math.round((completedSteps / totalSteps) * 100);

    // Build Header
    workspaceHeader.innerHTML = `
      <div class="header-top-row">
        <div class="project-title-group">
          <div class="workspace-title">${project.name}</div>
          <button class="btn-icon" onclick="editProjectName()" title="Edit Name">✏️</button>
        </div>
        <div class="workspace-actions">
          <button class="btn-outline" onclick="openProjectModal('COPY')">📋 Copy</button>
          <button class="btn-outline" onclick="exportBackupData()">💾 Backup</button>
          <button class="btn-danger-outline" onclick="deleteCurrentProject()">🗑️ Delete</button>
        </div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div class="progress-text">${progressPercent}% Workflow Completed</div>
        </div>
        <div class="progress-wrapper"><div class="progress-fill" style="width: ${progressPercent}%;"></div></div>
      </div>
    `;

    // Right Sidebar
    rightSidebar.style.display = "flex";
    let rightHtml = `
      <div class="right-panel-section">
        <div class="section-title" style="margin-top:0;">📍 Location</div>
    `;
    if (project.projectLocationLink) {
      rightHtml += `
        <div style="display: flex; gap: 8px; align-items: center;">
          <a href="${project.projectLocationLink}" target="_blank" class="btn-primary" style="text-decoration: none; padding: 10px 16px; font-size: 13px; flex: 1; text-align: center;">🌍 Open Map</a>
          <button class="btn-outline" style="padding: 10px; width: 40px;" onclick="updateField('${project.id}', 'locationLink', null, null, '')" title="Edit Link">✏️</button>
        </div>
      `;
    } else {
      rightHtml += `<input type="url" placeholder="Paste map or folder link..." onchange="updateField('${project.id}', 'locationLink', null, null, this.value)">`;
    }
    
    rightHtml += `
      </div>
      <div class="right-panel-section" style="border-bottom:none;">
        <div class="section-title" style="margin-top:0;">📋 Minor Tasks</div>
        <input type="text" id="new-check-text" placeholder="Add task & press Enter..." onkeypress="if(event.key==='Enter') addChecklistItem()" style="margin-bottom: 12px;">
        <div style="display: flex; flex-direction: column;">
    `;
    (project.checklist || []).forEach(item => {
      const isDone = item.status === 'COMPLETED';
      rightHtml += `
        <div class="check-item" style="${isDone ? 'opacity: 0.5;' : ''}">
           <input type="checkbox" ${isDone ? 'checked' : ''} onchange="updateChecklistStatus('${project.id}', ${item.id}, this.checked ? 'COMPLETED' : 'PENDING')">
           <div class="check-text" style="${isDone ? 'text-decoration: line-through;' : ''}">${item.text}</div>
           <button class="chk-del" onclick="deleteChecklistItem('${project.id}', ${item.id})">×</button>
        </div>
      `;
    });
    rightHtml += `</div></div>`;
    rightSidebar.innerHTML = rightHtml;

    // Center Content (Trades & Tiles)
    let html = `
      <details open>
        <summary class="section-title" style="margin-top: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="chevron">▼</span> PROJECT DIRECTORY / TRADES
          </div>
          <button class="btn-add-small" onclick="event.preventDefault(); openTradeModal();">+ Add Trade</button>
        </summary>
        <div class="contractors-grid">`;
        
    project.contractors.forEach((c, i) => {
      html += `
        <div class="card" style="padding: 16px;">
          <div class="trade-title">${c.trade}<span class="chk-del" style="opacity:1;" onclick="removeTrade(${i})" title="Remove Trade">×</span></div>
          <input type="text" list="rolodex-companies" placeholder="Company Name" value="${c.company}" onchange="updateField('${project.id}', 'contractor', ${i}, 'company', this.value)" style="margin-bottom:8px;">
          <div style="display: flex; gap: 8px;">
            <input type="text" placeholder="Contact" value="${c.contact}" onchange="updateField('${project.id}', 'contractor', ${i}, 'contact', this.value)">
            <input type="email" placeholder="Email" value="${c.email}" onchange="updateField('${project.id}', 'contractor', ${i}, 'email', this.value)">
          </div>
        </div>
      `;
    });
    
    html += `</div></details>
      <details open>
        <summary class="section-title" style="margin-top: 16px; border-top: 1px solid var(--border-soft); padding-top: 24px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="chevron">▼</span> WORKFLOW SEQUENCE
          </div>
          <button class="btn-add-small" onclick="event.preventDefault(); openJobModal();">+ Add Job</button>
        </summary>
        <div class="grid">`;
        
    project.steps.forEach(step => { html += generateTileHTML(step, project.id); });
    html += `</div></details>`;
    
    content.innerHTML = html;
  }

  // --- INITIALIZE APP ---
  updateRolodexDatalist();
  render();
  loadFromCloud();

</script>
</body>
</html>
