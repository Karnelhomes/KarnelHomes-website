<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karnel Homes — Projects</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
<style>
:root{--n:#172B4D;--sub:#626F86;--bd:#DCDFE4;--bg:#F7F8F9;--blue:#0C66E4;--blue-d:#0055CC;--blue-bg:#E9F2FF;--green:#1F845A;--red:#C9372C;--r:3px}
*{box-sizing:border-box;margin:0}
body{font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--n);background:#fff}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--bd);background:#fff;position:sticky;top:0;z-index:20}
.logo{width:28px;height:28px;border-radius:6px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
.bn{font-weight:700;font-size:15px}.sp{flex:1}.chip{font-size:12px;color:var(--sub)}
.btn{border:0;background:#091E420F;border-radius:var(--r);padding:0 12px;font-weight:500;height:32px;white-space:nowrap}
.btn:hover{background:#091E4224}.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.d{color:var(--red)}.btn.s{height:28px;padding:0 10px;font-size:13px}
.err{display:none;background:#FFEDEB;color:#AE2E24;padding:8px 16px;font-size:13px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 52px)}
.side{background:var(--bg);border-right:1px solid var(--bd);padding:12px 8px;overflow:auto}
.sh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 8px;font-size:12px;font-weight:700;color:var(--sub)}
.sh button{background:none;border:0;font-size:18px;line-height:1;color:var(--sub);border-radius:var(--r);width:24px;height:24px}
.sh button:hover{background:#091E4224}
.pi{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:7px 8px;border-radius:var(--r)}
.pi:hover{background:#091E420F}.pi.on{background:var(--blue-bg);color:var(--blue-d);font-weight:600}
.pi span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:24px;height:24px;border-radius:4px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
main{overflow:auto;padding:20px 32px 48px}
.bc{font-size:12px;color:var(--sub)}
.th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:6px}
h1{font-size:24px;line-height:28px;font-weight:600}.meta{color:var(--sub);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin:16px 0 18px}
.tab{background:none;border:0;padding:8px 12px;margin-bottom:-2px;border-bottom:2px solid transparent;font-weight:600;color:var(--sub)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}.tab:hover{color:var(--blue-d)}
.tb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.in{border:1px solid #8590A2;border-radius:var(--r);padding:0 8px;height:32px;background:#fff;min-width:0}
.tb .in{width:220px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--bg);border-radius:6px;padding:8px;min-height:260px}
.ch{font-size:12px;font-weight:700;color:var(--sub);padding:4px 6px 8px}
.cnt{background:#091E4214;border-radius:10px;padding:0 6px;margin-left:4px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 1px 1px #091E4240,0 0 1px #091E424f;padding:10px;margin-bottom:8px}
.card[draggable=true]{cursor:grab}.card.lk{background:#F1F2F4;color:var(--sub)}
.ct{margin-bottom:8px;word-break:break-word}
.cm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ep{font-size:12px;font-weight:600;background:#DFD8FD;color:#5E4DB2;padding:0 6px;border-radius:3px}
.due{font-size:12px;color:var(--sub)}.due.od{color:var(--red);font-weight:600}
.cf{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.cf select{height:24px;font-size:12px;border:0;background:#091E420F;border-radius:3px;padding:0 4px}
.x{background:none;border:0;color:var(--sub);font-size:16px;line-height:1;padding:2px 6px;border-radius:3px}.x:hover{background:#091E4224;color:var(--red)}
.lz{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:#DCDFE4;color:#44546F}
.lz.open{background:#F8E6A0;color:#7F5F01}.lz.done{background:#BAF3DB;color:#216E4E}
.pb{height:8px;background:#DCDFE4;border-radius:4px;overflow:hidden;margin:6px 0 20px;max-width:420px}.pb i{display:block;height:100%;background:var(--green)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--sub);padding:8px 10px;border-bottom:2px solid var(--bd)}
.tbl td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:hover td{background:var(--bg)}.tbl tr.lk td:first-child+td{color:var(--sub)}
.nm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#091E4214;font-size:12px;font-weight:600;margin-right:10px}
.ib{display:flex;gap:2px;justify-content:flex-end}
.ib button{background:none;border:0;color:var(--sub);padding:2px 7px;border-radius:3px}.ib button:hover{background:#091E4224;color:var(--n)}
.sa{display:flex;gap:6px}
.addrow{display:flex;gap:8px;margin-top:14px}.addrow .in{flex:1;max-width:360px}
.none{color:var(--sub);padding:12px 4px}
.empty{max-width:420px;margin:12vh auto;text-align:center}.empty h1{margin-bottom:8px}.empty p{color:var(--sub);margin-bottom:16px}
.ovl{position:fixed;inset:0;background:#091E4270;display:none;place-items:start center;padding-top:9vh;z-index:50}.ovl.on{display:grid}
.md{background:#fff;border-radius:6px;padding:24px;width:min(480px,92vw);box-shadow:0 8px 12px #091E4226,0 0 1px #091E424f}
.md h2{font-size:20px;line-height:24px;font-weight:500;margin-bottom:6px}
.md label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:14px 0 4px}.md .in{width:100%}
.dr{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.bdg{background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:0 6px;margin-left:6px}
.ban{display:none;background:#FFF7D6;border-bottom:1px solid #F8E6A0;color:#7F5F01;padding:6px 16px;font-size:13px;align-items:center;gap:12px}
.cal{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--bd);border-left:1px solid var(--bd)}
.dh{padding:6px;font-size:12px;font-weight:600;color:var(--sub);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);background:var(--bg)}
.dc{min-height:96px;padding:4px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer;overflow:hidden}
.dc:hover{background:var(--bg)}.dc.off{background:#FAFBFC;color:#8590A2}
.dn{font-size:12px;font-weight:600;display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;margin-bottom:2px}
.dc.td .dn{background:var(--blue);color:#fff}
.chp{display:block;width:100%;text-align:left;border:0;border-radius:3px;padding:0 5px;margin-bottom:2px;font-size:12px;line-height:18px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chp.tk{background:#fff;border:1px dashed currentColor}.chp.dn2{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--sub);padding-left:4px}
.agh{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 4px}.agh.red{color:var(--red)}
.ai{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:8px;border-radius:3px;cursor:pointer;border-left:3px solid transparent;align-items:start}
.ai:hover{background:var(--bg)}.ai.soon{border-left-color:#F5CD47;background:#FFFCF0}.ai.od{border-left-color:var(--red);background:#FFF5F4}
.at{font-size:12px;color:var(--sub);padding-top:1px}.ai .meta{font-size:12px}
.lz.bk{background:#CFE1FD;color:#0055CC}.lz.rm{background:#DFD8FD;color:#5E4DB2}
.ck{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:500}
@media(max-width:1100px){.cal{grid-template-columns:1fr}}
@media(max-width:900px){.board{grid-template-columns:1fr}.tbl .hide{display:none}}
@media(max-width:700px){.app{grid-template-columns:1fr;height:auto}.side{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}.sh{display:none}.pi{width:auto;white-space:nowrap}main{padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="logo">K</div><div class="bn">Karnel Homes</div><div class="sp"></div><div class="chip" id="chip">Starting…</div><button class="btn" onclick="openNotif()" aria-label="Alerts">Alerts<span class="bdg" id="bdg" style="display:none">0</span></button><button class="btn p" onclick="openCreate()">Create</button></header>
<div class="ban" id="ban"></div><div class="err" id="err"></div>
<div class="app"><aside class="side" id="side"></aside><main id="main"></main></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeM()"><div class="md" id="md"></div></div>

<script>
const KEY='karnel_v3', SB_URL='https://giovxsxgkdilawyxuiqb.supabase.co', SB_KEY='sb_publishable_k9sU8tyILCmQTxAI36ufWQ__JsPNSRY';
const STD=['Approvals received (CC / CDC)','Site set-up and demolition','Slab and footings','Frame and roof','Lock-up','Fit-out and services','Final inspections','Handover'];
const COLS=[['todo','To do'],['prog','In progress'],['done','Done']];
const LOCK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P={},cur=null,tab='board',q='',fs='',sb=null,chan,saveT,rtT,dragId=null,view='proj',cy=new Date().getFullYear(),cm=new Date().getMonth();

function showErr(m){const e=$('#err');e.style.display='block';e.innerHTML='Something went wrong: '+esc(m)+' <button class="btn s" onclick="resetLocal()">Reset this device and reload</button>'}
function resetLocal(){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_cur');location.reload()}
addEventListener('error',e=>showErr(e.message));
const keyOf=n=>String(n||'').replace(/[^a-z]/gi,'').slice(0,3).toUpperCase()||'PRJ';
const tint=n=>['#0C66E4','#1F845A','#8270DB','#C25100','#CD519D','#2B7A9B'][[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];

/* Normalise any project shape (this app's, or the older steps + checklist format). Never throws on blank entries. */
function norm(p){
  const A=x=>Array.isArray(x)?x.filter(o=>o&&typeof o==='object'):[];
  if(!Array.isArray(p.stages)){
    p.stages=A(p.steps).map(s=>({id:s.id||uid(),name:s.name||'Untitled stage',state:s.status==='COMPLETE'?'done':/PROGRESS|READY/.test(s.status)?'open':'locked'}));
    p.tasks=A(p.checklist).map(c=>({id:c.id||uid(),text:c.text||'Untitled task',stage:'',due:'',status:c.status==='COMPLETED'?'done':'todo'}));
  }
  p.stages=A(p.stages);p.tasks=A(p.tasks);
  p.events=A(p.events).filter(e=>/^\d{4}-\d\d-\d\d/.test(e.date||'')).map(e=>({id:e.id||uid(),title:e.title||e.text||'Booking',date:e.date.slice(0,10),time:e.time||'',kind:e.kind||'booking',who:e.who||'',note:e.note||'',done:e.done??/COMPLET|DONE/i.test(e.status||'')}));
  p.name=p.name||'Untitled project';p.created=p.created||p.updated_at||new Date().toISOString();p.key=p.key||keyOf(p.name);
  p.stages.forEach(s=>{s.id=s.id||uid();s.name=s.name||'Untitled stage';if(!['locked','open','done'].includes(s.state))s.state='locked'});
  p.tasks.forEach(t=>{t.id=t.id||uid();t.text=t.text||'Untitled task';t.status=t.status||(t.done?'done':'todo')});
  let m=Math.max(0,p.seq||0,...p.tasks.map(t=>t.n||0));p.tasks.forEach(t=>{if(!t.n)t.n=++m});p.seq=m;
  return p;
}
try{
  const raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('karnel_data_final16')||'{}');
  if(raw&&typeof raw==='object')Object.keys(raw).forEach(k=>{try{if(raw[k]&&typeof raw[k]==='object'){raw[k].id=raw[k].id||k;P[k]=norm(raw[k])}}catch(e){}});
  cur=localStorage.getItem(KEY+'_cur')||null;
}catch(e){P={}}
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const live=()=>Object.values(P).filter(p=>!p._deleted).sort((a,b)=>a.created<b.created?-1:1);

/* ---------- save + sync ---------- */
function chip(s){$('#chip').textContent={saving:'Saving…',live:'Synced',error:'Sync error, will retry',offline:'Offline, saved on this device'}[s]||s}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(P));localStorage.setItem(KEY+'_cur',cur||'')}catch(e){}}
function touch(p){p.updated_at=new Date().toISOString();p._dirty=1;persist();chip('saving');clearTimeout(saveT);saveT=setTimeout(sync,500)}
async function sync(){
  if(!sb)return chip('offline');
  const d=Object.values(P).filter(p=>p._dirty);if(!d.length)return chip('live');
  try{
    const {error}=await sb.from('karnel_projects').upsert(d.map(p=>{const {_dirty,...c}=p;return{id:p.id,name:p.name,data:c,updated_at:p.updated_at}}));
    if(error)throw error;d.forEach(p=>delete p._dirty);persist();chip('live');
  }catch(e){console.warn(e);chip('error')}
}
async function load(){
  if(!sb)return chip('offline');
  try{
    const {data,error}=await sb.from('karnel_projects').select('*');if(error)throw error;
    let changed=false;
    (data||[]).forEach(r=>{try{
      let d=r.data;if(typeof d==='string')d=JSON.parse(d);if(!d||typeof d!=='object')return;
      d.id=d.id||r.id;const l=P[r.id],ct=+new Date(d.updated_at||0),lt=+new Date(l?.updated_at||0);
      if(!l||ct>lt){P[r.id]=norm(d);changed=true}else if(lt>ct){l._dirty=1}
    }catch(e){}});
    const ids=new Set((data||[]).map(r=>r.id));Object.values(P).forEach(p=>{if(!ids.has(p.id))p._dirty=1});
    persist();if(changed)render();sync();listen();
  }catch(e){console.warn(e);chip('error')}
}
function listen(){
  try{if(chan)sb.removeChannel(chan);
  chan=sb.channel('karnel-live').on('postgres_changes',{event:'*',schema:'public',table:'karnel_projects'},pl=>{
    const n=pl.new,l=n&&P[n.id];
    if(n&&n.id&&n.data&&typeof n.data==='object'&&(!l||+new Date(n.data.updated_at||0)>+new Date(l.updated_at||0))){P[n.id]=norm(n.data);persist()}
    clearTimeout(rtT);rtT=setTimeout(()=>{if(!/INPUT|SELECT/.test(document.activeElement.tagName))render()},200);
  }).subscribe()}catch(e){}
}

/* ---------- modals ---------- */
function openM(h,f){$('#md').innerHTML=h;$('#ovl').classList.add('on');if(f)$(f).focus()}
function closeM(){$('#ovl').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const cancel='<button type="button" class="btn" onclick="closeM()">Cancel</button>';
function openCreate(){view==='cal'?openEvent(null,null,null,'reminder'):cur&&P[cur]&&!P[cur]._deleted?openTaskForm():openProjectForm()}
function openProjectForm(){openM(`<h2>Create project</h2><form onsubmit="createProject(event)">
  <label for="pn">Project name</label><input class="in" id="pn" required maxlength="80" placeholder="e.g. 14 Wattle Street duplex">
  <label for="pa">Site address</label><input class="in" id="pa" maxlength="120">
  <label for="pt">Workflow</label><select class="in" id="pt"><option value="std">Standard residential build (8 stages, all locked)</option><option value="blank">Blank, I'll add the stages</option></select>
  <div class="dr">${cancel}<button class="btn p">Create project</button></div></form>`,'#pn')}
function openTaskForm(){const p=P[cur];openM(`<h2>Create task</h2><form onsubmit="createTask(event)">
  <label>Project</label><input class="in" value="${esc(p.name)}" disabled>
  <label for="tn">Summary</label><input class="in" id="tn" required maxlength="140">
  <label for="tg">Workflow stage</label><select class="in" id="tg"><option value="">None</option>${p.stages.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
  <label for="td">Due date</label><input class="in" type="date" id="td">
  <div class="dr">${cancel}<button class="btn p">Create</button></div></form>`,'#tn')}

/* ---------- projects ---------- */
function createProject(e){
  e.preventDefault();const name=$('#pn').value.trim();
  const p=norm({id:'p_'+uid(),name,address:$('#pa').value.trim(),created:new Date().toISOString(),
    stages:$('#pt').value==='std'?STD.map(n=>({id:uid(),name:n,state:'locked'})):[],tasks:[]});
  P[p.id]=p;cur=p.id;tab='board';touch(p);closeM();render();
}
function pick(id){cur=id;view='proj';q='';fs='';persist();render()}
function editProject(){const p=P[cur],n=prompt('Project name',p.name);if(n&&n.trim())p.name=n.trim();const a=prompt('Site address',p.address||'');if(a!==null)p.address=a.trim();touch(p);render()}
function deleteProject(){const p=P[cur];if(confirm('Delete "'+p.name+'" with all its tasks and workflow?')){p._deleted=true;touch(p);render()}}
function setTab(t){tab=t;render()}

/* ---------- workflow: stages only change when you press the button ---------- */
const stage=sid=>P[cur].stages.find(s=>s.id===sid);
function setState(sid,s){stage(sid).state=s;touch(P[cur]);render()}
function addStage(e){e.preventDefault();const v=$('#ns').value.trim();if(!v)return;P[cur].stages.push({id:uid(),name:v,state:'locked'});touch(P[cur]);render();$('#ns').focus()}
function renameStage(sid){const s=stage(sid),n=prompt('Stage name',s.name);if(n&&n.trim()){s.name=n.trim();touch(P[cur]);render()}}
function moveStage(sid,d){const a=P[cur].stages,i=a.findIndex(s=>s.id===sid),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];touch(P[cur]);render()}
function delStage(sid){const p=P[cur],s=stage(sid);if(!confirm('Delete stage "'+s.name+'"? Its tasks stay on the project.'))return;p.stages=p.stages.filter(x=>x.id!==sid);p.tasks.forEach(t=>{if(t.stage===sid)t.stage=''});touch(p);render()}

/* ---------- tasks ---------- */
const locked=(p,t)=>{const s=t.stage&&p.stages.find(x=>x.id===t.stage);return s&&s.state==='locked'};
function createTask(e){e.preventDefault();const p=P[cur];p.tasks.push({id:uid(),n:++p.seq,text:$('#tn').value.trim(),stage:$('#tg').value,due:$('#td').value,status:'todo'});touch(p);closeM();tab='board';render()}
function setStatus(tid,s){const p=P[cur],t=p.tasks.find(t=>t.id===tid);if(!t||locked(p,t))return;t.status=s;touch(p);render()}
function delTask(tid){P[cur].tasks=P[cur].tasks.filter(t=>t.id!==tid);touch(P[cur]);render()}
function drop(e,s){e.preventDefault();if(dragId)setStatus(dragId,s);dragId=null}
function setQ(v){q=v.toLowerCase();cols()}
function setFs(v){fs=v;cols()}

/* ---------- render ---------- */
function render(){
  const L=live();if(!cur||!P[cur]||P[cur]._deleted)cur=L[0]?.id||null;persist();alerts();
  $('#side').innerHTML=`<button class="pi${view==='cal'?' on':''}" onclick="goCal()"><span class="av" style="background:#44546F"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span>Calendar</span></button><div class="sh">Projects<button onclick="openProjectForm()" aria-label="Create project">+</button></div>`+L.map(p=>`<button class="pi${view==='proj'&&p.id===cur?' on':''}" onclick="pick('${p.id}')"><span class="av" style="background:${tint(p.name)}">${esc(p.key.slice(0,2))}</span><span>${esc(p.name)}</span></button>`).join('');
  const m=$('#main');
  if(view==='cal'){m.innerHTML=`<h1>Calendar</h1><div class="meta" style="margin-bottom:16px">Bookings, reminders and task due dates for every project.</div>`+calView(null);return}
  if(!cur){m.innerHTML=`<div class="empty"><h1>Create your first project</h1><p>Add a project, then set up its workflow and tasks. Workflow stages stay locked until you unlock them.</p><button class="btn p" onclick="openProjectForm()">Create project</button></div>`;return}
  const p=P[cur],S=p.stages,n=k=>S.filter(s=>s.state===k).length;
  m.innerHTML=`<div class="bc">Projects / ${esc(p.name)}</div>
    <div class="th"><div><h1>${esc(p.name)}</h1><div class="meta">${esc(p.address)||'No site address'}  (key ${esc(p.key)})</div></div>
      <div class="sa"><button class="btn" onclick="editProject()">Edit details</button><button class="btn d" onclick="deleteProject()">Delete</button></div></div>
    <div class="tabs"><button class="tab${tab==='board'?' on':''}" onclick="setTab('board')">Board</button><button class="tab${tab==='flow'?' on':''}" onclick="setTab('flow')">Workflow</button><button class="tab${tab==='cal'?' on':''}" onclick="setTab('cal')">Calendar</button></div>
    <div id="body"></div>`;
  tab==='board'?board(p):tab==='flow'?flow(p,n):$('#body').innerHTML=calView(p.id);
}
function flow(p,n){
  const S=p.stages,pct=S.length?Math.round(n('done')/S.length*100):0;
  const rows=S.map((s,i)=>{
    const ts=p.tasks.filter(t=>t.stage===s.id),dn=ts.filter(t=>t.status==='done').length;
    const lz=s.state==='locked'?`<span class="lz">${LOCK} Locked</span>`:s.state==='open'?'<span class="lz open">Unlocked</span>':'<span class="lz done">Complete</span>';
    const acts=s.state==='locked'?`<button class="btn s p" onclick="setState('${s.id}','open')">Unlock stage</button>`
      :s.state==='open'?`<button class="btn s p" onclick="setState('${s.id}','done')">Mark complete</button><button class="btn s" onclick="setState('${s.id}','locked')">Lock</button>`
      :`<button class="btn s" onclick="setState('${s.id}','open')">Reopen</button>`;
    return `<tr class="${s.state==='locked'?'lk':''}"><td><span class="nm">${i+1}</span>${esc(s.name)}</td><td>${lz}</td><td class="hide">${ts.length?dn+' of '+ts.length+' done':'No tasks'}</td><td><div class="sa">${acts}</div></td>
      <td><div class="ib"><button title="Move up" aria-label="Move up" onclick="moveStage('${s.id}',-1)">↑</button><button title="Move down" aria-label="Move down" onclick="moveStage('${s.id}',1)">↓</button><button title="Rename" aria-label="Rename stage" onclick="renameStage('${s.id}')">✎</button><button title="Delete" aria-label="Delete stage" onclick="delStage('${s.id}')">✕</button></div></td></tr>`}).join('');
  $('#body').innerHTML=`<div><b>${n('done')} of ${S.length}</b> stages complete</div><div class="pb"><i style="width:${pct}%"></i></div>
    ${S.length?`<table class="tbl"><thead><tr><th>Stage</th><th>Status</th><th class="hide">Tasks</th><th>Action</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="none">No stages yet. Add the first one below.</p>'}
    <form class="addrow" onsubmit="addStage(event)"><input class="in" id="ns" maxlength="80" placeholder="Add a stage" aria-label="New stage name"><button class="btn p">Add stage</button></form>`;
}
function board(p){
  $('#body').innerHTML=`<div class="tb"><input class="in" type="search" placeholder="Search tasks" aria-label="Search tasks" value="${esc(q)}" oninput="setQ(this.value)">
    <select class="in" aria-label="Filter by stage" onchange="setFs(this.value)"><option value="">All stages</option>${p.stages.map(s=>`<option value="${s.id}"${fs===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <button class="btn p" onclick="openTaskForm()">Create task</button></div><div class="board" id="cols"></div>`;
  cols();
}
function cols(){
  const p=P[cur],today=ymd(new Date());
  const list=p.tasks.filter(t=>(!fs||t.stage===fs)&&(!q||(t.text+' '+p.key+'-'+t.n).toLowerCase().includes(q)));
  $('#cols').innerHTML=COLS.map(([k,label])=>{
    const ts=list.filter(t=>t.status===k);
    return `<div class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${k}')"><div class="ch">${label}<span class="cnt">${ts.length}</span></div>`+ts.map(t=>{
      const s=t.stage&&p.stages.find(x=>x.id===t.stage),lk=locked(p,t),od=t.due&&t.status!=='done'&&t.due<today;
      const due=t.due?new Date(t.due+'T00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'';
      return `<div class="card${lk?' lk':''}" draggable="${!lk}" ondragstart="dragId='${t.id}'"><div class="ct">${esc(t.text)}</div>
        <div class="cm">${s?`<span class="ep">${esc(s.name)}</span>`:''}${lk?`<span class="lz">${LOCK} Stage locked</span>`:''}${due?`<span class="due${od?' od':''}">${od?'Overdue ':'Due '}${due}</span>`:''}</div>
        <div class="cf"><span>${esc(p.key)}-${t.n}</span><span><select aria-label="Status" ${lk?'disabled':''} onchange="setStatus('${t.id}',this.value)">${COLS.map(([v,l])=>`<option value="${v}"${t.status===v?' selected':''}>${l}</option>`).join('')}</select><button class="x" aria-label="Delete task" onclick="delTask('${t.id}')">×</button></span></div></div>`}).join('')+`</div>`}).join('');
}


/* ---------- calendar, agenda and alerts ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=(k,o)=>new Date(k+'T00:00').toLocaleDateString('en-AU',o);
const KIND={booking:['Booking','bk'],reminder:['Reminder','rm'],task:['Task due','']};
function items(pid){
  const o=[];live().forEach(p=>{if(pid&&p.id!==pid)return;
    p.events.forEach(e=>o.push({id:e.id,pid:p.id,pn:p.name,date:e.date,time:e.time,title:e.title,kind:e.kind==='booking'?'booking':'reminder',who:e.who,done:e.done}));
    p.tasks.forEach(t=>{if(t.due)o.push({id:t.id,pid:p.id,pn:p.name,date:t.due,time:'',title:t.text,kind:'task',done:t.status==='done'})})});
  return o.sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
}
const due=()=>{const lim=ymd(addD(new Date(),2));return items().filter(i=>!i.done&&i.date<=lim)};
function alerts(){
  const d=due(),b=$('#bdg'),n=$('#ban');b.textContent=d.length;b.style.display=d.length?'':'none';
  n.style.display=d.length?'flex':'none';n.innerHTML=`<span><b>${d.length}</b> ${d.length>1?'items are':'item is'} due within 2 days or overdue.</span><button class="btn s" onclick="openNotif()">View</button>`;
}
function pushNotes(){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const td=ymd(new Date());let n;try{n=JSON.parse(localStorage.getItem('karnel_notified'))}catch(e){}
    if(!n||n.d!==td)n={d:td,ids:[]};
    due().forEach(i=>{if(!n.ids.includes(i.id)){new Notification((i.date<td?'Overdue: ':i.date===td?'Today: ':'Coming up: ')+i.title,{body:i.pn+', '+fmt(i.date,{weekday:'short',day:'numeric',month:'short'})+(i.time?' at '+i.time:'')});n.ids.push(i.id)}});
    localStorage.setItem('karnel_notified',JSON.stringify(n));
  }catch(e){}
}
function askNotes(){Notification.requestPermission().then(()=>{pushNotes();openNotif()})}
function openNotif(){
  const can='Notification' in window&&Notification.permission==='default';
  openM(`<h2>Due in the next 2 days</h2><p class="meta">Includes overdue items. Mark a booking or reminder as completed to clear it.</p>${groups(due(),true)}${can?'<button class="btn" style="margin-top:14px" onclick="askNotes()">Turn on desktop alerts</button>':''}<div class="dr"><button class="btn" onclick="closeM()">Close</button></div>`);
}
function row(i,sp){
  const t=ymd(new Date()),c=i.date<t?' od':i.date<=ymd(addD(new Date(),2))?' soon':'',[kl,kc]=KIND[i.kind];
  return `<div class="ai${c}" onclick="openItem('${i.pid}','${i.id}','${i.kind}')"><div class="at">${i.time||'All day'}</div><div><b>${esc(i.title)}</b><div class="meta">${sp?esc(i.pn):''}${sp&&i.who?', ':''}${i.who?'with '+esc(i.who):''}</div></div><span class="lz ${kc}">${kl}</span></div>`;
}
function groups(list,sp){
  const t=ymd(new Date()),tm=ymd(addD(new Date(),1));let h='',last='';
  list.forEach(i=>{const g=i.date<t?'Overdue':i.date===t?'Today':i.date===tm?'Tomorrow':fmt(i.date,{weekday:'long',day:'numeric',month:'short'});
    if(g!==last){h+=`<div class="agh${g==='Overdue'?' red':''}">${g}</div>`;last=g}h+=row(i,sp)});
  return h||'<p class="none">Nothing scheduled.</p>';
}
const cp=i=>{const c=tint(i.pn),tk=i.kind==='task';return `<button class="chp${tk?' tk':''}${i.done?' dn2':''}" style="${tk?'color:'+c:'background:'+c}" title="${esc(i.title)}" onclick="event.stopPropagation();openItem('${i.pid}','${i.id}','${i.kind}')">${i.time?i.time+' ':''}${esc(i.title)}</button>`};
function mv(d){if(!d){const n=new Date();cy=n.getFullYear();cm=n.getMonth()}else{const x=new Date(cy,cm+d,1);cy=x.getFullYear();cm=x.getMonth()}render()}
function goCal(){view='cal';render()}
function goTask(pid){cur=pid;view='proj';tab='board';q='';fs='';render()}
function openItem(pid,id,kind){kind==='task'?goTask(pid):openEvent(pid,id)}
function calView(pid){
  const its=items(pid),first=new Date(cy,cm,1),off=(first.getDay()+6)%7,days=new Date(cy,cm+1,0).getDate(),rows=Math.ceil((off+days)/7),td=ymd(new Date()),by={};
  its.forEach(i=>(by[i.date]=by[i.date]||[]).push(i));
  let g='<div class="cg">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<rows*7;i++){const d=new Date(cy,cm,1-off+i),k=ymd(d),L=by[k]||[];
    g+=`<div class="dc${d.getMonth()!==cm?' off':''}${k===td?' td':''}" onclick="openEvent(${pid?`'${pid}'`:'null'},null,'${k}')"><span class="dn">${d.getDate()}</span>${L.slice(0,3).map(cp).join('')}${L.length>3?`<div class="more">+${L.length-3} more</div>`:''}</div>`}
  g+='</div>';
  const a=pid?`'${pid}'`:'null';
  return `<div class="tb"><button class="btn" onclick="mv(-1)" aria-label="Previous month">‹</button><button class="btn" onclick="mv(0)">Today</button><button class="btn" onclick="mv(1)" aria-label="Next month">›</button><b style="font-size:16px;margin:0 8px">${first.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</b><span class="sp"></span>
    <button class="btn" onclick="openEvent(${a},null,null,'booking')">Add booking</button><button class="btn p" onclick="openEvent(${a},null,null,'reminder')">Add reminder</button></div>
    <div class="cal"><div>${g}</div><div><h2 style="font-size:16px;font-weight:600">Agenda</h2>${groups(its.filter(i=>!i.done).slice(0,40),!pid)}</div></div>`;
}
function openEvent(pid,id,date,kind){
  const L=live();if(!L.length)return openProjectForm();
  const e=id&&P[pid]?.events.find(x=>x.id===id),pr=pid||(cur&&P[cur]&&!P[cur]._deleted?cur:L[0].id);
  const v=e||{kind:kind||'reminder',title:'',date:date||ymd(new Date()),time:'',who:'',note:'',done:false};
  openM(`<h2>${e?'Edit':'Add'} ${e?v.kind:kind||'event'}</h2><form onsubmit="saveEvent(event,'${e?pid:''}','${e?id:''}')">
    <label for="ek">Type</label><select class="in" id="ek"><option value="booking"${v.kind==='booking'?' selected':''}>Booking</option><option value="reminder"${v.kind!=='booking'?' selected':''}>Reminder</option></select>
    <label for="et">Title</label><input class="in" id="et" required maxlength="140" value="${esc(v.title)}" placeholder="e.g. Plumber rough-in, call council">
    <label for="ep">Project</label><select class="in" id="ep" ${e?'disabled':''}>${L.map(p=>`<option value="${p.id}"${p.id===pr?' selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label for="ed">Date</label><input class="in" type="date" id="ed" required value="${v.date}">
    <label for="em">Time (optional)</label><input class="in" type="time" id="em" value="${v.time}">
    <label for="ew">With (optional)</label><input class="in" id="ew" maxlength="80" value="${esc(v.who)}" placeholder="Contractor, certifier or company">
    <label for="en">Notes (optional)</label><input class="in" id="en" maxlength="200" value="${esc(v.note)}">
    ${e?`<label class="ck"><input type="checkbox" id="edn" ${v.done?'checked':''}> Mark as completed</label>`:''}
    <div class="dr">${e?`<button type="button" class="btn d" style="margin-right:auto" onclick="delEvent('${pid}','${id}')">Delete</button>`:''}${cancel}<button class="btn p">Save</button></div></form>`,'#et');
}
function saveEvent(x,pid0,id0){
  x.preventDefault();const p=P[id0?pid0:$('#ep').value];
  const d={title:$('#et').value.trim(),kind:$('#ek').value,date:$('#ed').value,time:$('#em').value,who:$('#ew').value.trim(),note:$('#en').value.trim(),done:id0?$('#edn').checked:false};
  if(id0)Object.assign(p.events.find(e=>e.id===id0),d);else p.events.push({id:uid(),...d});
  touch(p);closeM();render();
}
function delEvent(pid,id){const p=P[pid];p.events=p.events.filter(e=>e.id!==id);touch(p);closeM();render()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#ovl').classList.contains('on')){render();pushNotes()}});

try{render();chip(sb?'live':'offline');load();pushNotes();setInterval(()=>{alerts();pushNotes()},900000)}catch(e){showErr(e.message)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sync()});
</script>
</body>
</html>
